<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notion Quick">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Notion Quick</title>
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #191919;
    --ink2: #37352F;
    --sub: #787774;
    --faint: #A5A29C;
    --line: #EDECE9;
    --hover: #F1F1EF;
    --field: #F7F7F5;
    --red: #E03E3E;
    --fs-input: 20px;   /* 書く欄（1行目） */
    --fs: 17px;         /* 画面の文字すべて */
    --fs-sub: 14px;     /* 補足・ラベル */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink2); }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: var(--fs); line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  svg { display: block; flex: none; }

  /* ── ログイン ── */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 340px; }
  .login-box h1 { font-size: 24px; font-weight: 600; color: var(--ink); margin: 0 0 4px; letter-spacing: -.01em; }
  .login-box p { margin: 0 0 24px; color: var(--sub); font-size: var(--fs-sub); }
  .login-box input { width: 100%; font-size: var(--fs); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); margin-bottom: 10px; outline: none; }
  .login-box input:focus { border-color: #C7C6C3; background: #fff; }
  .primary { width: 100%; background: var(--ink); color: #fff; border-radius: 8px; padding: 12px; font-weight: 600; font-size: var(--fs); }
  .primary:disabled { opacity: .4; }
  .err { color: var(--red); font-size: var(--fs-sub); margin-top: 10px; min-height: 1em; }

  /* ── ヘッダー ── */
  /* 画面全体を「見えている高さ」に合わせる（キーボードが出たら縮む）。
     中身だけスクロールし、下のバーは常に中身のすぐ下＝キーボードの上にくる */
  /* 普通のページスクロール。下のバーは sticky なので、中身が短いときは中身のすぐ下、長いときは画面の下に貼りつく */
  #app { min-height: 100dvh; display: flex; flex-direction: column; }
  #scroller { flex: 1; }
  header {
    position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    padding: calc(var(--safe-t) + 8px) 12px 8px; display: flex; align-items: center; gap: 4px;
  }
  /* 作業中の表示（ヘッダーのすぐ下） */
  .busy { position: absolute; left: 0; right: 0; top: 100%; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); padding: 6px 16px 7px; font-size: 12.5px; color: var(--sub); }
  .busy-row { display: flex; align-items: center; gap: 8px; }
  .busy-row #busyText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
  .busy-row #busyTime { font-variant-numeric: tabular-nums; color: var(--faint); }
  .busy-spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  .busy-track { height: 3px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; position: relative; }
  .busy-track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 2px; transition: width .3s; }
  .busy-track.indet i { width: 30% !important; animation: indet 1.2s ease-in-out infinite; }
  @keyframes indet { 0% { left: -30%; } 100% { left: 100%; } }
  #dbBtn { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; min-width: 0; color: var(--ink); font-weight: 600; font-size: var(--fs); }
  #dbBtn:active, .icon-btn:active { background: var(--hover); }
  #dbIcon { font-size: var(--fs); line-height: 1; color: var(--sub); }
  #dbBtn .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dbBtn .chev { color: var(--faint); }
  .spacer { flex: 1; }
  .icon-btn:disabled { opacity: .3; }
  .badge { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; line-height: 18px; font-weight: 600; }
  .note-section { display: flex; align-items: center; justify-content: space-between; margin: 14px 10px 4px; font-size: var(--fs-sub); font-weight: 600; color: var(--sub); }
  .primary.small { width: auto; padding: 6px 12px; font-size: var(--fs-sub); }
  .note-date { margin: 14px 10px 6px; font-size: var(--fs-sub); color: var(--faint); font-weight: 600; }
  .note { margin: 0 6px 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .note.pending { border-color: #F5C2C0; background: #FFF9F8; }
  .note-head { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sub); color: var(--sub); margin-bottom: 4px; }
  .note-head b { color: var(--ink); font-weight: 600; }
  .tag-pending { margin-left: auto; color: var(--red); font-weight: 600; }
  .note-body { white-space: pre-wrap; font-size: 15px; line-height: 1.5; color: var(--ink2); max-height: 9em; overflow: hidden; }
  .note-meta { font-size: 12px; color: var(--faint); margin-top: 6px; }
  .note-meta:empty { display: none; }
  .note-actions { display: flex; justify-content: flex-end; gap: 14px; margin-top: 6px; font-size: var(--fs-sub); }
  .note-actions:empty { display: none; }
  .note-actions a, .note-actions button { color: var(--sub); text-decoration: none; }
  .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--sub); border-radius: 6px; }

  /* ── 入力（見た目は1つの欄。1行目＝タイトル 20px、2行目から＝本文 17px） ── */
  main { padding: 6px 20px 16px; max-width: 720px; margin: 0 auto; }
  #title, #body { width: 100%; border: none; outline: none; background: transparent; color: var(--ink); display: block; }
  #title { font-size: var(--fs-input); line-height: 1.4; padding: 6px 0 2px; resize: none; overflow: hidden; }
  #body { font-size: 17px; line-height: 1.35; resize: none; padding: 0 0 6px; min-height: 18vh; color: var(--ink2); }
  #title::placeholder, #body::placeholder { color: #C9C7C2; }

  /* プロパティ（大きめのボタンで、歩きながらでも押しやすく） */
  #props { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; font-size: var(--fs-sub); }
  .prop-row { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: var(--fs-sub); }
  .prop-row svg { color: var(--sub); }
  .date-val { position: relative; padding: 6px 8px; margin-left: -8px; border-radius: 8px; color: var(--ink); }
  .date-val:active { background: var(--hover); }
  .date-val input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .date-val .k { color: var(--sub); margin-right: 8px; }
  .link-btn { margin-left: auto; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--faint); }
  .link-btn.on { color: var(--ink); }
  .url-input { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 10px; padding: 8px 10px; font-size: 16px; outline: none; margin: 2px 0 6px; }
  .prop-label { font-size: 12px; color: var(--sub); margin: 8px 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 10px; border-radius: 6px; font-size: var(--fs-sub); line-height: 1.3; border: 1.5px solid transparent; opacity: .45; display: flex; align-items: center; gap: 8px; }
  .chip.on { opacity: 1; border-color: var(--ink); }
  .chip .sq { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; }
  .chip.check { background: var(--field); color: var(--ink2); opacity: 1; border-color: var(--line); display: flex; align-items: center; gap: 6px; }
  .chip.check.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 添付 */
  #attachments { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  #attachments:empty { display: none; }
  .thumb { position: relative; width: 88px; height: 88px; border-radius: 6px; overflow: hidden; background: var(--field); border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 6px; background: rgba(25,25,25,.6); color: #fff; font-size: var(--fs-sub); line-height: 26px; text-align: center; }
  .audio-item { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; background: #fff; }
  .audio-item .play { width: 40px; height: 40px; border-radius: 50%; background: var(--hover); display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .audio-item .meta { flex: 1; font-size: var(--fs); min-width: 0; color: var(--ink); }
  .audio-item .meta small { display: block; color: var(--sub); font-size: var(--fs-sub); }
  .audio-item label { font-size: var(--fs-sub); color: var(--sub); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .audio-item .del { color: var(--faint); padding: 10px; }

  /* 下のバー */
  /* 入力中（キーボード表示中）は、バーを画面に固定してキーボードのすぐ上に出す */
  .kb #bar { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: 10px; }
  .kb main { padding-bottom: 92px; }
  #bar {
    position: sticky; bottom: 0; z-index: 6; flex: none; background: #fff;
    border-top: 1px solid var(--line); padding: 10px 16px calc(var(--safe-b) + 10px);
    display: flex; align-items: center; gap: 10px;
  }
  .tool { width: 52px; height: 56px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink2); background: #fff; }
  .tool:active { background: var(--hover); }
  #recBtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); position: absolute; top: 11px; right: 11px; }
  #recBtn { position: relative; }
  #saveBtn { flex: 1; height: 56px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 600; font-size: var(--fs); }
  #saveBtn:disabled { background: #E3E2E0; color: #A5A29C; }

  /* 録音中 */
  #recPanel { position: fixed; inset: 0; z-index: 20; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  #recLabel { display: flex; align-items: center; gap: 8px; color: var(--sub); font-size: var(--fs); }
  #recLabel i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1.2s infinite; }
  #recCost { font-size: var(--fs-sub); color: var(--faint); min-height: 1.4em; margin-top: -14px; }
  #recCost.warn { color: var(--red); }
  #recLive { width: calc(100% - 40px); max-width: 640px; max-height: 38vh; overflow-y: auto; font-size: 17px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; text-align: left; }
  #recLive:empty { display: none; }
  #recLive .interim { color: var(--faint); }
  #recLive .note { color: var(--faint); font-size: var(--fs-sub); }
  #recTime { font-size: 56px; font-weight: 300; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  #recStop { width: 96px; height: 96px; border-radius: 50%; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; }
  #recStop span { width: 32px; height: 32px; border-radius: 5px; background: var(--ink); }
  #recCancel { color: var(--sub); font-size: var(--fs); padding: 12px 20px; border-radius: 6px; }
  @keyframes blink { 50% { opacity: .25; } }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* シート（Notionのメニュー風） */
  .sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(15,15,15,.25); display: flex; align-items: flex-end; }
  .sheet { width: 100%; max-height: 80vh; overflow-y: auto; background: #fff; border-radius: 12px 12px 0 0; padding: 8px 8px calc(var(--safe-b) + 14px); box-shadow: 0 -4px 24px rgba(0,0,0,.08); }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 8px; }
  .sheet h2 { font-size: var(--fs-sub); font-weight: 600; color: var(--sub); margin: 6px 10px 4px; display: flex; align-items: center; }
  .sheet h2 .close { margin-left: auto; color: var(--sub); font-weight: 400; }
  .item { display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 8px; width: 100%; text-align: left; color: var(--ink2); text-decoration: none; font-size: var(--fs); }
  .item:active { background: var(--hover); }
  .item .ic { width: 22px; text-align: center; color: var(--sub); }
  .item[data-mode] .t, .item .t .s { white-space: normal; }
  #openWords .t .s { display: block; margin-top: 2px; }
  .item[data-mode] .t .s { display: block; margin-top: 2px; }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { color: var(--faint); font-size: var(--fs-sub); white-space: nowrap; }
  .item .check { color: var(--ink); }
  .star { color: #D3D1CB; font-size: 20px; width: 28px; }
  .star.on { color: var(--ink); }
  .toggle { width: 22px; height: 22px; accent-color: #191919; }
  .muted { color: var(--sub); font-size: var(--fs-sub); margin: 6px 10px 10px; line-height: 1.6; }
  .dict-add { display: grid; gap: 8px; margin: 4px 10px 8px; }
  .dict-add input { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); outline: none; }
  .del-dict { color: var(--faint); padding: 6px; }
  .w-row { display: flex; align-items: center; gap: 6px; padding: 2px 6px 2px 10px; }
  .w-row input { flex: 1; min-width: 0; font-size: 16px; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink2); outline: none; }
  .w-row input:focus { border-color: var(--line); background: var(--field); }
  .w-row .arrow { color: var(--faint); flex: none; }
  .w-row .no { color: var(--faint); font-size: 11px; width: 34px; flex: none; text-align: right; }
  .w-search { position: sticky; top: -8px; z-index: 1; background: #fff; padding: 6px 10px 8px; }
  .w-search input { width: 100%; font-size: 16px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); outline: none; }
  .w-link { color: var(--sub); font-size: var(--fs-sub); padding: 8px 10px; }
  .sep { height: 1px; background: var(--line); margin: 6px 4px; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 92px); transform: translateX(-50%); z-index: 40; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; font-size: var(--fs-sub); width: max-content; max-width: 90vw; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .toast.bad { background: var(--red); }
  .toast-act { color: #fff; text-decoration: underline; margin-left: 12px; font-weight: 600; font-size: inherit; }
  .toast a { color: #fff; text-decoration: underline; margin-left: 10px; }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>Notion Quick</h1>
    <p>日記アプリと同じアカウントでログイン</p>
    <input id="email" type="email" placeholder="メールアドレス" autocomplete="username" required>
    <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" required>
    <button class="primary" type="submit" id="loginBtn">ログイン</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <div id="scroller">
  <header>
    <button id="dbBtn">
      <span id="dbIcon"></span>
      <span class="name" id="dbName">読み込み中…</span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="icon-btn" id="clearBtn" aria-label="クリア" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5l4.5 4.5-9.5 9.5H6.5L3.5 14.5z"/><path d="M10.5 9l4.5 4.5M6.5 17.5H21"/></svg>
    </button>
    <button class="icon-btn" id="historyBtn" aria-label="保存されたノート" style="position:relative">
      <span id="outboxBadge" class="badge hidden">0</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
    <div id="busy" class="busy hidden"><div class="busy-row"><span class="busy-spin"></span><span id="busyText"></span><span id="busyTime"></span></div><div class="busy-track indet" id="busyTrack"><i id="busyFill"></i></div></div>
  </header>

  <main>
    <textarea id="title" rows="1" placeholder="ここに書く" autocomplete="off" enterkeyhint="next"></textarea>
    <textarea id="body"></textarea>
    <div id="attachments"></div>
    <div id="props"></div>
  </main>
  </div>

  <div id="bar">
    <button class="tool" id="photoBtn" aria-label="写真">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>
    </button>
    <button class="tool" id="importBtn" aria-label="録音ファイルを取り込む">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="6" width="10" height="12" rx="3"/><path d="M9 6l.6-3h4.8l.6 3M9 18l.6 3h4.8l.6-3"/><path d="M12 9.5v4M10.3 11.8l1.7 1.7 1.7-1.7"/></svg>
    </button>
    <button class="tool" id="recBtn" aria-label="録音">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      <span class="dot"></span>
    </button>
    <button id="saveBtn" disabled>保存</button>
  </div>
  <input type="file" id="photoInput" accept="image/*" multiple class="hidden">
  <input type="file" id="audioInput" accept=".m4a,.mp3,.wav,.aac,.caf,.mp4a" multiple class="hidden">
</section>

<div id="recPanel" class="hidden">
  <div id="recLabel"><i></i><span id="recStatus">録音中</span></div>
  <div id="recTime">0:00</div>
  <div id="recCost"></div>
  <div id="recLive"></div>
  <button id="recStop" aria-label="停止"><span></span></button>
  <div class="spinner hidden" id="recSpin"></div>
  <button id="recCancel">キャンセル</button>
</div>

<div id="sheet" class="sheet-bg hidden"><div class="sheet" id="sheetBody"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 設定 =====
const SUPABASE_URL = "https://oqtyorwlrnrcyjxiassg.supabase.co";
const SUPABASE_KEY = "sb_publishable_5KRsDfHG07lsUL7uUr6zpQ_2ehucxbJ"; // 公開用キー（ブラウザに置いてOK）
const FN = "quick-note";
const APP_VERSION = "2026.11.26-6";     // 更新のたびに変える
const DEFAULT_DB_TITLE = "日報";          // 初回だけ、この名前のDBをデフォルトにする

let busyStart = 0, busyTimer = 0, busyPrefix = "";
function busy(msg, frac) {
  const el = $("busy");
  if (!el) return;
  if (!msg) { el.classList.add("hidden"); clearInterval(busyTimer); busyTimer = 0; busyStart = 0; return; }
  if (!busyStart) busyStart = Date.now();
  $("busyText").textContent = (state.saving ? "" : busyPrefix) + msg;
  const track = $("busyTrack");
  if (typeof frac === "number") { track.classList.remove("indet"); $("busyFill").style.width = Math.max(4, Math.min(100, frac * 100)) + "%"; }
  else { track.classList.add("indet"); $("busyFill").style.width = ""; }
  el.classList.remove("hidden");
  const tick = () => { const s = Math.floor((Date.now() - busyStart) / 1000); $("busyTime").textContent = s >= 3 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : ""; };
  tick();
  if (!busyTimer) busyTimer = setInterval(tick, 1000);
}

function toast(msg, bad = false, link, action) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.innerHTML = esc(msg) + (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">開く</a>` : "")
    + (action ? `<button class="toast-act">${esc(action.label)}</button>` : "");
  if (action) t.querySelector(".toast-act").onclick = () => { t.remove(); action.fn(); };
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), Math.max(bad ? 5000 : 3000, String(msg).length * 110));
}

}

// 話した内容を「施設名」と「本文」に分ける
//  1) 冒頭が過去の施設名と一致したら、そこで区切る（長い名前を優先）
//  2) 一致しなければ、最初の「。」までをタイトルにする（30文字以内のとき）
//  3) どちらでもなければ、全部を本文にする
function splitTitle(text) {
  const t = String(text || "").trim();
  const squash = (s) => s.replace(/[\s　]/g, "");
  const flat = squash(t);
  const names = knownNames().sort((a, b) => b.length - a.length);
  for (const name of names) {
    const n = squash(name);
    if (!n || !flat.startsWith(n)) continue;
    // 空白を飛ばしながら、元の文章のどこまでが施設名かを数える
    let i = 0, k = 0;
    while (i < t.length && k < n.length) { if (!/[\s　]/.test(t[i])) k++; i++; }
    return { title: name, body: t.slice(i).replace(/^[\s　。、,.．，:：]+/, "") };
  }
  const m = t.match(/^(.{1,30}?)[\s　]*[。．.](.*)$/s);
  if (m) return { title: m[1].trim(), body: m[2].replace(/^[\s　]+/, "") };
  return { title: "", body: t };
}

async function openDb(id) {
  if (!id) return;
  saveDraft();
  state.dbId = id;
  const cached = store.get("qn.schema." + id);
  const meta = state.databases.find((d) => d.id === id);
  $("dbIcon").innerHTML = dbIconHtml(meta);

  if (cached) applySchema(cached);
  refreshNames(id);

    if (state.dbId === id) applySchema(fresh, !!cached);
  } catch (e) {
    if (!cached) toast("データベースを読めません: " + e.message, true);
  }
}

function applySchema(schema, keepValues = false) {
  state.schema = schema;
  if (!keepValues) {
    state.values = {};
    let firstDate = true;
    for (const p of schema.properties) {
      if (p.type === "date" && firstDate) { state.values[p.name] = todayStr(); firstDate = false; }
      if (p.type === "multi_select") state.values[p.name] = [];
      if (p.type === "checkbox") state.values[p.name] = false;
    }
    if (state.audios.length) autoCheckAudio();
    const d = store.get("qn.draft." + state.dbId);
    setText(typeof d === "string" ? d : d ? [d.title, d.body].filter(Boolean).join("\n") : "");
    autoGrow();
  }

  renderProps();
  updateSaveBtn();
}

// 長辺2048px・JPEGに縮小（Notion無料プランの5MB制限に収めるため）
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 2048;
      const r = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src);
      c.toBlob((b) => b ? resolve(new File([b], `photo-${Date.now()}.jpg`, { type: "image/jpeg" })) : reject(), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(); };
    img.src = src;
  });
}

// ===== 録音 → 文字起こし =====
let rec = null;
function pickMime() {
  const list = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
  return list.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
const extOf = (mime) => mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : mime.includes("webm") ? "webm" : "m4a";

$("recBtn").onclick = startRec;
async function startRec() {
  if (!window.MediaRecorder) { toast("このブラウザは録音に対応していません", true); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { toast("マイクの使用が許可されていません（設定 → Safari → マイク）", true); return; }
  startLive(stream);
  const mime = pickMime();
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 48000 } : undefined);
  const chunks = [];
  rec = { mr, stream, chunks, start: Date.now(), cancelled: false, timer: null };
  mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = onRecStop;
  mr.start(1000);
  $("recTime").textContent = "0:00";
  setRecLabel();
  $("recLabel").querySelector("i").classList.remove("hidden");
  $("recStop").classList.remove("hidden"); $("recSpin").classList.add("hidden"); $("recCancel").classList.remove("hidden");
  $("recPanel").classList.remove("hidden");
  rec.timer = setInterval(() => {
    const sec = (Date.now() - rec.start) / 1000;
    $("recTime").textContent = mmss(sec);
    const left = MAX_REC_SEC - sec;
    const liveSec = live.okAt ? (Date.now() - live.okAt) / 1000 : 0;
    const costText = isLiveMode()
      ? (liveSec ? `文字起こし 約${fmtYen(yen(liveSec, PRICE_LIVE_PER_MIN))}` : "")
      : `止めたあと文字起こし 約${fmtYen(yen(sec, PRICE_FILE_PER_MIN))}`;
    $("recCost").textContent = (left <= 30 ? `あと${Math.ceil(left)}秒で自動で止まります　` : "") + costText;
    $("recCost").classList.toggle("warn", left <= 30);
    if (sec >= MAX_REC_SEC) { rec.autoStopped = `${MAX_REC_SEC / 60}分たったので、自動で止めました`; stopRec(); }
  }, 250);
}
function stopRec(cancel = false) {
  if (!rec || rec.mr.state === "inactive") return;
  rec.cancelled = cancel;
  if (cancel) stopLive(true);
  clearInterval(rec.timer);
  rec.mr.stop();
}
// ===== 話しながら文字を表示（OpenAI のリアルタイム文字起こし）=====
// 録音と同じマイクの音を WebRTC で OpenAI に送り、文字を受け取りながら表示する。
// 止めたら、その文字をそのまま本文に入れる（ファイルの文字起こしはしない＝二重に料金がかからない）。
// うまくつながらなかったときは、今までどおり録音ファイルを文字起こしする。
const live = { pc: null, dc: null, track: null, items: {}, order: [], ok: false, failed: false, reason: "",
               gotDelta: false, commitTimer: null, startedAt: 0, waiters: [], missedStart: false, meter: null };

// 一時キーを先に取っておく（録音ボタンを押してからの待ち時間を減らす）
let liveKey = null;   // { value, at }
async function prefetchLiveKey() {
  if (!isLiveMode() || (liveKey && Date.now() - liveKey.at < 8 * 60 * 1000)) return;
  try {
    const { value } = await api({ action: "live_token", prompt: transcribeHint(), keywords: liveKeywords() });
    if (value) liveKey = { value, at: Date.now() };
  } catch {}
}
async function takeLiveKey() {
  const k = liveKey && Date.now() - liveKey.at < 9 * 60 * 1000 ? liveKey.value : null;
  liveKey = null;
  setTimeout(prefetchLiveKey, 1500);   // 次の録音のために取り直しておく
  if (k) return k;
  const { value } = await api({ action: "live_token", prompt: transcribeHint(), keywords: liveKeywords() });
  return value;
}

// 文字起こしの使用量を月ごとに記録（料金の目安を設定画面に出す）
const monthKey = () => { const d = new Date(); return `qn.usage.${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
function addUsage(kind, sec) {
  if (!(sec > 0)) return;
  const u = store.get(monthKey()) || { live: 0, file: 0 };
  u[kind] = (u[kind] || 0) + sec;
  store.set(monthKey(), u);
}
function usageSummary() {
  const u = store.get(monthKey()) || { live: 0, file: 0 };
  const sumYen = (u.sumUsd || 0) * YEN_PER_USD;
  const total = yen(u.live, PRICE_LIVE_PER_MIN) + yen(u.file, PRICE_FILE_PER_MIN) + sumYen;
  return { total, liveMin: u.live / 60, fileMin: u.file / 60, sumYen, sumN: u.sumN || 0 };
}
function addSummaryUsage(usd) {
  const u = store.get(monthKey()) || { live: 0, file: 0 };
  u.sumUsd = (u.sumUsd || 0) + (usd > 0 ? usd : 0.02); u.sumN = (u.sumN || 0) + 1;
  store.set(monthKey(), u);
}

// ===== 取り込んだ録音をAIでまとめる（議事録アプリの「医師面談」と同じ形）=====
const isImportSummary = () => store.get("qn.importSummary") !== false;
const isKeepAudio = () => store.get("qn.keepAudio") !== false;   // 録音もNotionに保存する（最初の状態）
async function summarizeToText(transcript) {
  const fixed = applyDict(transcript);
  const r = await api({ action: "summarize", transcript: fixed, names: knownNames().slice(0, 80), terms: hintWords().slice(0, 120).join("、") });
  addSummaryUsage(r.usd);
  const x = r.result || {};
  const arr = (v) => (Array.isArray(v) ? v : []).map((t) => String(t ?? "").trim()).filter(Boolean);
  const sec = (h, lines) => lines.length ? [`## ${h}`, ...lines.map((t) => "- " + t)].join("\n") : "";
  const title = applyDict(String(x.facility || "").trim()) || splitTitle(fixed).title;
  const parts = [
    x.doctor ? String(x.doctor).trim() : "",
    x.summary ? `## 要約\n${String(x.summary).trim()}` : "",
    (Array.isArray(x.topics) && x.topics.length) ? ["## 話題", ...x.topics.map((t) => `- ${[String(t.heading || "").trim(), arr(t.points).join("／")].filter(Boolean).join("：")}`)].join("\n") : "",
    sec("先生の反応", arr(x.reaction)),
    sec("処方の状況", arr(x.usage)),
    sec("依頼・宿題", arr(x.requests)),
    arr(x.next).length ? ["## 次回", ...arr(x.next).map((t) => "[ ] " + t)].join("\n") : "",
    sec("⚠️ 副作用の可能性", arr(x.ae)),
    x.veeva ? `## Veeva用\n${String(x.veeva).trim()}` : "",
    `## 文字起こし\n${fixed.trim()}`,
  ].filter(Boolean);
  return applyDict(title + "\n" + parts.join("\n\n"));
}
// 入力欄が空ならまとめで埋める。書きかけがあれば本文の後ろに足す
function placeSummary(text) {
  if (!getText().trim()) { setText(text); }
  else { const [, ...rest] = text.split("\n"); insertText(rest.join("\n")); }
  autoGrow(); saveDraft();
}

// 録音の状態表示：つながるまでは「準備中」、つながったら「話してください」
function setRecLabel() {
  const dot = $("recLabel").querySelector("i");
  if (!isLiveMode() || live.failed) { $("recStatus").textContent = "録音中"; dot.style.background = ""; return; }
  if (live.ok) { $("recStatus").textContent = "話してください"; dot.style.background = ""; }
  else { $("recStatus").textContent = "準備中…"; dot.style.background = "var(--faint)"; }
}

// つながる前に話し始めたかを、マイクの音量で見張る
function startMeter(stream) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser();
    an.fftSize = 1024;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let loud = 0;
    live.lastVoiceAt = Date.now();
    const timer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (const v of buf) sum += v * v;
      const rms = Math.sqrt(sum / buf.length);
      loud = rms > 0.02 ? loud + 1 : 0;
      if (loud >= 2) {
        live.lastVoiceAt = Date.now();
        // つながる前に声が出ていた（その分はリアルタイムでは届かない）
        if (isLiveMode() && !live.ok && !live.failed) live.missedStart = true;
      }
      // しゃべらない時間が続いたら、録音しっぱなしを防ぐため自動で止める
      if (rec && Date.now() - live.lastVoiceAt > SILENCE_STOP_SEC * 1000) {
        rec.autoStopped = `${SILENCE_STOP_SEC}秒間声がなかったので、自動で止めました`;
        stopRec(false);
      }
    }, 80);
    live.meter = { ctx, timer };
  } catch {}
}
function stopMeter() {
  if (!live.meter) return;
  clearInterval(live.meter.timer);
  try { live.meter.ctx.close(); } catch {}
  live.meter = null;
}

function liveText() { return live.order.map((id) => live.items[id] || "").join("").trim(); }
function renderLive() {
  const el = $("recLive");
  const t = liveText();
  if (t) el.innerHTML = esc(t);
  else if (live.failed) el.innerHTML = `<span class="note">話しながらの表示は使えませんでした（止めると文字起こしされます）<br>理由: ${esc(live.reason || "不明")}</span>`;
  else if (isLiveMode() && !live.ok) el.innerHTML = `<span class="note">文字起こしに接続中…</span>`;
  else el.innerHTML = "";
  el.scrollTop = el.scrollHeight;
}
function liveSend(ev) { try { if (live.dc?.readyState === "open") live.dc.send(JSON.stringify(ev)); } catch {} }

async function startLive(stream) {
  Object.assign(live, { pc: null, dc: null, track: null, items: {}, order: [], ok: false, failed: false, reason: "",
                        gotDelta: false, commitTimer: null, startedAt: Date.now(), waiters: [], missedStart: false,
                        okAt: 0, liveSec: 0 });
  renderLive(); setRecLabel();
  startMeter(stream);
  if (!isLiveMode()) return;
  try {
    if (!window.RTCPeerConnection) throw new Error("この画面ではリアルタイム通信が使えません");
    const value = await takeLiveKey();
    if (!value) throw new Error("一時キーを受け取れませんでした");
    if (!rec || rec.stream !== stream) return;   // つないでいる間に止められた
    const pc = new RTCPeerConnection();
    live.pc = pc;
    live.track = stream.getAudioTracks()[0].clone();   // 録音とは別の複製を送る
    pc.addTrack(live.track);
    const dc = pc.createDataChannel("oai-events");
    live.dc = dc;
    dc.onmessage = (e) => onLiveEvent(JSON.parse(e.data));
    dc.onopen = () => {
      live.ok = true; live.okAt = Date.now(); renderLive(); setRecLabel();
      // 区切りなしでは文字が来ないモデルの場合に備え、数秒たっても文字が来なければ一定間隔で区切って送る
      live.commitTimer = setInterval(() => {
        if (!live.gotDelta && Date.now() - live.startedAt > 4000) liveSend({ type: "input_audio_buffer.commit" });
      }, 4000);
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const res = await fetch("https://api.openai.com/v1/realtime/calls", {
      method: "POST", body: offer.sdp,
      headers: { Authorization: `Bearer ${value}`, "Content-Type": "application/sdp" },
    });
    if (!res.ok) throw new Error(`接続エラー (${res.status}) ${(await res.text()).slice(0, 120)}`);
    await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
  } catch (err) {
    live.failed = true; live.reason = String(err?.message || err);
    stopLive(true);
    renderLive(); setRecLabel();
  }
}

function onLiveEvent(ev) {
  const id = ev.item_id;
  switch (ev.type) {
    case "input_audio_buffer.committed":
      if (id && !live.order.includes(id)) live.order.push(id);
      break;
    case "conversation.item.input_audio_transcription.delta":
      live.gotDelta = true;
      if (id && !live.order.includes(id)) live.order.push(id);
      live.items[id] = (live.items[id] || "") + (ev.delta || "");
      renderLive();
      break;
    case "conversation.item.input_audio_transcription.completed":
      if (id && !live.order.includes(id)) live.order.push(id);
      live.items[id] = ev.transcript || live.items[id] || "";
      renderLive();
      live.waiters.splice(0).forEach((f) => f());
      break;
    case "error":
      console.warn("live error", ev);
      break;
  }
}

// 止めるとき：最後の区切りを送り、仕上がった文字が届くのを少し待ってから切る
async function finishLive() {
  if (!live.pc || !live.ok) { stopLive(true); return ""; }
  liveSend({ type: "input_audio_buffer.commit" });
  await new Promise((resolve) => {
    live.waiters.push(resolve);
    setTimeout(resolve, 5000);
  });
  // 届き遅れの分をもう少しだけ待つ
  await new Promise((r) => setTimeout(r, 400));
  const t = liveText();
  stopLive(true);
  return t;
}
function stopLive() {
  clearInterval(live.commitTimer);
  if (live.pc && live.okAt) { live.liveSec = (Date.now() - live.okAt) / 1000; addUsage("live", live.liveSec); live.okAt = 0; }
  try { live.dc?.close(); } catch {}
  try { live.pc?.close(); } catch {}
  try { live.track?.stop(); } catch {}
  live.pc = null; live.dc = null; live.track = null;
}

$("recStop").onclick = () => stopRec(false);
$("recCancel").onclick = () => stopRec(true);

async function onRecStop() {
  const r = rec;
  const sec = (Date.now() - r.start) / 1000;
  stopMeter();
  if (r.cancelled) { stopLive(); r.stream.getTracks().forEach((t) => t.stop()); $("recPanel").classList.add("hidden"); rec = null; return; }
  $("recStop").classList.add("hidden"); $("recCancel").classList.add("hidden"); $("recSpin").classList.remove("hidden");
  $("recLabel").querySelector("i").classList.add("hidden");
  $("recStatus").textContent = "仕上げ中…";
  // リアルタイムの文字を受け取りきってから、マイクを止める
  const lt = await finishLive();
  r.stream.getTracks().forEach((t) => t.stop());

  const size = r.chunks.reduce((n, c) => n + c.size, 0);
  const mime = (r.mr.mimeType || r.chunks[0]?.type || "audio/mp4");
  const ext = extOf(mime);
  const blob = size ? new Blob(r.chunks, { type: mime.split(";")[0] }) : null;
  const audio = blob && size >= 2000 ? { blob, url: URL.createObjectURL(blob), ext, sec, keep: isKeepAudio() } : null;
  // 4.7MBを超える録音は、声の部分だけを小さくして4.7MBずつに分けて保存する
  if (audio && blob.size > ATTACH_LIMIT) {
    try { const info = await extractSpeech(blob); if (info.speechSec > 0.5) audio.parts = attachParts(info.speech); else audio.keep = false; }
    catch (e) { console.warn("parts", e); audio.keep = false; }
  }
  try {
    let text = lt;
    let extra = "";
    // リアルタイムが使えなかったとき、またはつながる前に話し始めていたとき（冒頭が抜けている）は、
    // 最初から取れている録音ファイルを文字起こしして、それを使う
    if (audio && (!text || live.missedStart)) {
      $("recStatus").textContent = "AIで文字起こし中…"; busy("文字起こし中…");
      text = (await apiFile("transcribe", blob, `voice-${Date.now()}.${ext}`, { prompt: transcribeHint() })).text || "";
      addUsage("file", sec);
      if (lt && live.missedStart) {
        extra = `話し始めが接続前だったので、録音全体も文字起こししました（追加 約${fmtYen(yen(sec, PRICE_FILE_PER_MIN))}）`;
      }
    }
    const notes = [r.autoStopped, extra].filter(Boolean);
    if (notes.length) setTimeout(() => toast(notes.join("。"), false), 50);
    if (!text.trim()) {
      toast("声を聞き取れませんでした。マイクが使えているか確認して、もう一度録音してください", true);
      return;
    }
    if (isImportSummary()) {
      $("recStatus").textContent = "AIでまとめ中…"; busy("AIでまとめ中…（数十秒かかります）");
      try { placeSummary(await summarizeToText(text)); }
      catch (e2) {
        if (isNetErr(e2) && audio) { audio.needsSummary = true; audio.pendingText = text; toast("電波がないので、まとめは送信するときに行います"); }
        else { placeTranscript(text); toast("まとめに失敗したので、文字起こしだけ入れました: " + e2.message, true); }
      }
    } else placeTranscript(text);
    if (audio) { state.audios.push(audio); autoCheckAudio(); }
    renderAttachments(); renderProps(); updateSaveBtn();
  } catch (e) {
    // 文字起こしに失敗しても録音は残す
    // 文字起こしできなかった録音は残しておき、保存して送るときに文字起こしする（圏外でも録音は失わない）
    if (audio) { audio.needsText = true; audio.summarize = isImportSummary(); state.audios.push(audio); autoCheckAudio(); }
    renderAttachments(); renderProps(); updateSaveBtn();
    toast(isNetErr(e) ? "電波がないので、文字起こしは送信するときに行います" : "文字起こしに失敗しました（送信時にもう一度試します）: " + e.message, !isNetErr(e));
  } finally {
    busy(null);
    $("recPanel").classList.add("hidden");
    rec = null;
  }
}

// 文字起こし結果を入れる（辞書で読み替え→1行目が空なら施設名と本文に分ける）
function placeTranscript(text) {
  const fixed = applyDict(text);
  if (!$("title").value.trim()) {
    const { title, body } = splitTitle(fixed);
    $("title").value = title;
    insertText(body);
  } else {
    insertText(fixed);
  }
}

// ===== 録音ファイルを取り込む（Apple Watch の Just Press Record などで録ったもの）=====
// 1つ選んだとき … 入力欄に文字起こしを入れる（見直してから保存）
// 2つ以上選んだとき … 1ファイル＝1件のノートとして、まとめて保存（文字起こしは送るときに行う）
$("importBtn").onclick = () => $("audioInput").click();
$("audioInput").addEventListener("change", async (e) => {
  const files = [...e.target.files].sort((a, b) => a.lastModified - b.lastModified);
  e.target.value = "";
  if (!files.length) return;
  if (files.length === 1) return importOne(files[0]);
  return importMany(files);
});

// ファイルの拡張子と、Notion・文字起こしが受け付ける形式にそろえる
function normalizeAudio(file) {
  const ext = (file.name.match(/\.([a-z0-9]+)$/i)?.[1] || "m4a").toLowerCase();
  const type = { m4a: "audio/mp4", mp4: "audio/mp4", aac: "audio/aac", mp3: "audio/mpeg", wav: "audio/wav", caf: "audio/x-caf" }[ext] || file.type || "audio/mp4";
  return { blob: new File([file], file.name, { type }), ext };
}
// 録音の長さ（秒）を調べる。わからなければファイルサイズから目安を出す
function audioDuration(blob) {
  return new Promise((resolve) => {
    const a = new Audio();
    const url = URL.createObjectURL(blob);
    const done = (v) => { URL.revokeObjectURL(url); resolve(v); };
    a.preload = "metadata";
    a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : blob.size / 16000);
    a.onerror = () => done(blob.size / 16000);
    setTimeout(() => done(blob.size / 16000), 4000);
    a.src = url;
  });
}
// ===== 声のある部分だけを抜き出す（無音・止め忘れの部分は文字起こしに送らない）=====
// 録音を16kHzモノラルに読み込み、30ミリ秒ごとの音量から「声がある区間」を探してつなげる。
// 文字起こしの料金は送った長さで決まるので、無音を除くほど安くなる。
// 出力は WAV（1本あたり最長10分。それより長ければ分割して順番に文字起こしする）
const SR = 16000, FRAME = 480;               // 16kHz・30ミリ秒
const ATTACH_LIMIT = 4.7 * 1024 * 1024;      // Notionに添付する1ファイルの大きさ（上限5MBに余裕をもたせて）
const ATTACH_SR = 8000;                       // 添付用は電話くらいの音質（1ファイル約5分）
const CHUNK_SEC = 600;                       // 1本10分（WAVで約19MB、文字起こしの上限25MB未満）
async function extractSpeech(file) {
  const ab = await file.arrayBuffer();
  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const buf = await new Promise((res, rej) => {
    const p = new Ctx(1, SR, SR).decodeAudioData(ab, res, rej);
    if (p && p.then) p.then(res, rej);
  });
  // モノラルに
  const n = buf.length;
  const mono = new Float32Array(n);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) mono[i] += d[i] / buf.numberOfChannels;
  }
  const totalSec = n / SR;
  // 30ミリ秒ごとの音量
  const frames = Math.floor(n / FRAME);
  const rms = new Float32Array(frames);
  for (let f = 0; f < frames; f++) {
    let s = 0;
    for (let i = f * FRAME, e = i + FRAME; i < e; i++) s += mono[i] * mono[i];
    rms[f] = Math.sqrt(s / FRAME);
  }
  // 周りの雑音の大きさ（静かな方から2割の位置）を基準に、それよりはっきり大きい所を「声」とみなす
  const sorted = Float32Array.from(rms).sort();
  const floor = sorted[Math.floor(sorted.length * 0.2)] || 0;
  const thr = Math.max(floor * 2.5, 0.006);
  // 声の区間をつくる（1.5秒以内の途切れはつなげる・前後0.3秒の余白・0.3秒未満は捨てる）
  const GAP = 50, PAD = 10, MIN = 10;
  const segs = [];
  let start = -1, last = -1;
  for (let f = 0; f < frames; f++) {
    if (rms[f] > thr) {
      if (start < 0) start = f;
      else if (f - last > GAP) { segs.push([start, last]); start = f; }
      last = f;
    }
  }
  if (start >= 0) segs.push([start, last]);
  const kept = segs.filter(([a, b]) => b - a >= MIN).map(([a, b]) => [Math.max(0, a - PAD) * FRAME, Math.min(frames, b + PAD + 1) * FRAME]);
  // つなげる（区間の間に0.25秒の間をはさむ）
  const gap = Math.round(SR * 0.25);
  const outLen = kept.reduce((s, [a, b]) => s + (b - a) + gap, 0);
  const out = new Float32Array(outLen);
  let o = 0;
  for (const [a, b] of kept) { out.set(mono.subarray(a, b), o); o += (b - a) + gap; }
  const speechSec = outLen / SR;
  // 10分ごとに WAV にする
  const chunks = [];
  for (let i = 0; i < outLen; i += CHUNK_SEC * SR) chunks.push(toWav(out.subarray(i, Math.min(outLen, i + CHUNK_SEC * SR))));
  return { totalSec, speechSec, chunks, segments: kept.length, speech: out };
}
// Notionに添付する用：声の部分だけを電話くらいの音質にして、4.7MBずつに分ける
function attachParts(speech) {
  const n = Math.floor(speech.length / 2), low = new Float32Array(n);
  for (let i = 0; i < n; i++) {   // かるく平らにしてから半分に間引く（16kHz → 8kHz）
    const a = speech[2 * i - 1] ?? speech[2 * i], b = speech[2 * i], c = speech[2 * i + 1] ?? b;
    low[i] = 0.25 * a + 0.5 * b + 0.25 * c;
  }
  const per = Math.floor((ATTACH_LIMIT - 44) / 2);   // 1ファイルに入るサンプル数
  const parts = [];
  for (let i = 0; i < n; i += per) {
    const seg = low.subarray(i, Math.min(n, i + per));
    parts.push({ blob: toWav(seg, ATTACH_SR), sec: seg.length / ATTACH_SR });
  }
  return parts;
}
function toWav(samples, sr = SR) {
  const b = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) { const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([b], { type: "audio/wav" });
}
// 取り込んだ録音を、文字起こし用に準備する（抜き出せなかったら元の録音をそのまま使う）
async function prepareImport(file) {
  const { blob, ext } = normalizeAudio(file);
  busy(`録音を読み込み、声の部分を探しています…（${fmtSize(blob.size)}）`);
  let info = null;
  try { info = await extractSpeech(blob); } catch (e) { console.warn("extractSpeech", e); }
  const sec = info ? info.totalSec : await audioDuration(blob);
  const audio = { blob, ext, sec, keep: blob.size <= ATTACH_LIMIT };   // keep は下で設定に合わせる
  if (info && info.speechSec > 0.5) {
    audio.txBlobs = info.chunks;          // 文字起こしに送るのは声のある部分だけ
    audio.txSec = info.speechSec;
    // 元の録音が大きすぎてNotionに付けられないときは、声の部分だけを小さくして添付する
    if (!audio.keep) { audio.parts = attachParts(info.speech); audio.keep = true; }
  } else if (info) {
    audio.txBlobs = []; audio.txSec = 0;  // 声が見つからなかった
  } else if (blob.size > 24 * 1024 * 1024) {
    audio.tooBig = true;                  // 抜き出しもできず、そのままでは大きすぎる
  }
  if (!isKeepAudio()) audio.keep = false;   // 設定で「録音もNotionに保存する」がオフ
  return audio;
}
// 文字起こし（分割されていれば順番に）。料金の記録もここで
async function transcribeAudio(a) {
  if (a.tooBig) throw new Error("録音が長すぎて文字起こしできません（25MBまで）");
  const parts = a.txBlobs || [a.blob];
  const texts = [];
  for (const [i, b] of parts.entries()) {
    const m = parts.length > 1 ? `文字起こし中 ${i + 1}/${parts.length}…` : "文字起こし中…";
    if (state.saving) saveStep(m, parts.length > 1 ? i / parts.length : undefined); else busy(m, parts.length > 1 ? i / parts.length : undefined);
    const ext = a.txBlobs ? "wav" : a.ext;
    const r = await apiFile("transcribe", b, `voice-${Date.now()}-${i}.${ext}`, { prompt: transcribeHint() });
    texts.push(String(r.text || "").trim());
  }
  addUsage("file", a.txSec ?? a.sec ?? 0);
  return texts.filter(Boolean).join("\n");
}
const trimNote = (a) => a.txSec != null && a.sec - a.txSec > 5
  ? `録音${mmss(a.sec)}のうち声のある${mmss(a.txSec)}だけ文字起こし（約${fmtYen(yen(a.txSec, PRICE_FILE_PER_MIN))}）`
  : `${mmss(a.sec)}・約${fmtYen(yen(a.txSec ?? a.sec, PRICE_FILE_PER_MIN))}`;

// 録音を始めた日時。ファイル名に日時があればそれ（例: 2026-11-18 10-23-45.m4a）、
// なければファイルの更新日時（＝録音が終わった時刻）から録音の長さを引く
function recStartOf(f, sec) {
  const m = /(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})[ T_-]+(\d{2})[-_.:h]?(\d{2})/.exec(f.name || "");
  if (m) {
    const d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
    if (!isNaN(d) && d.getMonth() === +m[2] - 1) return d;
  }
  return new Date((f.lastModified || Date.now()) - Math.round((sec || 0) * 1000));
}
const fileDate = (f, sec) => isoLocal(recStartOf(f, sec));

async function importOne(file) {
  toast("録音を読み込んでいます…");
  const audio = await prepareImport(file);
  audio.url = URL.createObjectURL(audio.blob);
  // 録音を始めた日時を日付プロパティに入れる
  const dp = state.schema?.properties.find((p) => p.type === "date");
  if (dp) state.values[dp.name] = fileDate(file, audio.sec);
  try {
    if (audio.txSec === 0) { toast("声が見つかりませんでした（録音は添付しておきます）", true); }
    else {
      if (!navigator.onLine) throw new Error("offline");
      toast(`文字起こし中…（${trimNote(audio)}）`);
      const text = await transcribeAudio(audio);
      if (!text.trim()) toast("声を聞き取れませんでした（録音は添付しておきます）", true);
      else if (isImportSummary()) {
        toast("まとめています…"); busy("AIでまとめ中…（数十秒かかります）");
        try { placeSummary(await summarizeToText(text)); toast(`まとめました。${trimNote(audio)}`); }
        catch (e2) {
          if (isNetErr(e2)) { audio.needsSummary = true; audio.pendingText = text; toast("電波がないので、まとめは送信するときに行います"); }
          else { placeTranscript(text); toast("まとめに失敗したので、文字起こしだけ入れました: " + e2.message, true); }
        }
      }
      else { placeTranscript(text); toast(`取り込みました。${trimNote(audio)}`); }
    }
  } catch (err) {
    audio.needsText = !audio.tooBig;
    audio.summarize = isImportSummary();
    toast(audio.tooBig ? err.message
      : isNetErr(err) ? "電波がないので、文字起こしは送信するときに行います" : "文字起こしに失敗しました（送信時にもう一度試します）: " + (err?.message || err), !isNetErr(err));
    console.warn("importOne", err);
  }
  busy(null);
  state.audios.push(audio);
  autoCheckAudio();
  renderAttachments(); renderProps(); updateSaveBtn(); saveDraft();
}

async function importMany(files) {
  if (!state.schema) return;
  const meta = state.databases.find((d) => d.id === state.dbId);
  const dp = state.schema.properties.find((p) => p.type === "date");
  const audioCheck = state.schema.properties.find((p) => p.type === "checkbox" && p.name === AUTO_CHECK_ON_AUDIO);
  let total = 0, speech = 0;
  toast(`${files.length}件の録音を読み込んでいます…`);
  for (const [fi, f] of files.entries()) {
    busy(`録音を読み込み中 ${fi + 1}/${files.length}…`, fi / files.length);
    const a = await prepareImport(f);
    total += a.sec; speech += a.txSec ?? a.sec;
    const props = {};
    if (dp) props[dp.name] = fileDate(f, a.sec);
    if (audioCheck) props[audioCheck.name] = true;
    await outbox.put({
      id: `n${Date.now()}${Math.random().toString(36).slice(2, 6)}`,
      createdAt: f.lastModified || Date.now(),
      dbId: state.dbId,
      dbTitle: meta?.title || state.schema.title || "",
      text: "",
      props,
      images: [],
      audios: [{ ...a, needsText: a.txSec !== 0 && !a.tooBig, summarize: isImportSummary() }],
    });
  }
  updateOutboxBadge(); busy(null);
  toast(`${files.length}件を取り込みました。録音${mmss(total)}のうち声のある${mmss(speech)}だけ文字起こしして、${meta?.title || ""}に1件ずつ保存します（約${fmtYen(yen(speech, PRICE_FILE_PER_MIN))}）`);
  flushOutbox();
}

// 本文の最後に追記する
function insertText(t) {
  const b = $("body");
  if (t) b.value = b.value.trim() ? b.value.replace(/\s+$/, "") + "\n" + t : t;
  autoGrow(); updateSaveBtn(); saveDraft();
}

// ===== 保存 =====
$("saveBtn").onclick = save;
async function save() {
  if (state.saving) return;
  state.saving = true; state.saveStep = ""; updateSaveBtn();
  const meta = state.databases.find((d) => d.id === state.dbId);
  // いま画面にある内容を1件のノートとしてまとめる
  const note = {
    id: `n${Date.now()}${Math.random().toString(36).slice(2, 6)}`,
    createdAt: Date.now(),
    dbId: state.dbId,
    dbTitle: meta?.title || state.schema?.title || "",
    text: getText(),
    props: JSON.parse(JSON.stringify(state.values)),
    images: state.images.map((im) => im.file),
    audios: state.audios.filter((a) => a.keep || a.needsText || a.needsSummary)
      .map((a) => ({ blob: a.blob, ext: a.ext, sec: a.sec, keep: a.keep, needsText: !!a.needsText,
        txBlobs: a.txBlobs, txSec: a.txSec, parts: a.parts, tooBig: a.tooBig,
        summarize: !!a.summarize, needsSummary: !!a.needsSummary, pendingText: a.pendingText || "" })),
  };
  try {
    if (!navigator.onLine) throw new Error("offline");
    const res = await sendNote(note);
    addSent(note, res.url);
    if (res.failed.length) toast(`保存しました。${res.failed.join("・")}は添付できませんでした`, true, res.url);
    else toast("保存しました", false, res.url);
    refreshNames(state.dbId);
  } catch (err) {
    // 電波がない・Notionにつながらない → 端末に保存して、あとで自動で送る
    note.lastError = isNetErr(err) ? "" : String(err?.message || err);
    try {
      await outbox.put(note);
      toast(isNetErr(err) ? "電波がないので端末に保存しました。つながったら自動で送ります"
                          : "送れなかったので端末に保存しました。あとで自動で送り直します", !isNetErr(err));
      updateOutboxBadge();
    } catch (e2) {
      toast("保存できませんでした: " + (e2?.message || e2), true);
      state.saving = false; state.saveStep = ""; busy(null); updateSaveBtn();
      return;   // 端末にも保存できなかったときは、画面の内容を消さない
    }
  }
  state.saving = false; state.saveStep = ""; busy(null);
  resetForm();
  updateSaveBtn();
}

// 1件のノートを Notion に送る（写真・音声のアップロード、必要なら文字起こしも）
async function sendNote(note) {
  let text = note.text || "";
  const attachments = [];
  const failed = [];
  // 途中まで終わった分（文字起こし・まとめ）は端末のノートに書き戻す。送り直すときに同じ料金を二重に払わないように
  const persist = async () => { note.text = text; if (note.fromOutbox) { try { await outbox.put(note); } catch {} } };
  for (const a of note.audios || []) {
    // 圏外で取り込んだなどで、まだ文字起こし・まとめをしていない録音
    if (a.needsText) {
      const t = await transcribeAudio(a);
      a.needsText = false; a.txBlobs = null;
      if (t && a.summarize) { a.needsSummary = true; a.pendingText = t; }
      else if (t) text = mergeTranscript(text, t);
      await persist();
    }
    if (a.needsSummary && a.pendingText) {
      saveStep("AIでまとめ中…");
      let sum = "";
      try { sum = await summarizeToText(a.pendingText); } catch (err) { if (isNetErr(err)) throw err; }
      text = sum ? (text.trim() ? text.replace(/\s+$/, "") + "\n\n" + sum.split("\n").slice(1).join("\n") : sum)
                 : mergeTranscript(text, a.pendingText);
      a.needsSummary = false; a.pendingText = "";
      await persist();
    }
  }
  for (const f of note.images || []) {
    try { const name = f.name || `photo-${Date.now()}.jpg`; const { id } = await apiFile("upload", f, name); attachments.push({ id, kind: "image", name }); }
    catch (err) { if (isNetErr(err)) throw err; failed.push("写真"); }
  }
  for (const a of (note.audios || []).filter((x) => x.keep)) {
    if (a.parts?.length) {
      // 声の部分だけを小さくした録音（分かれていれば「1of2」「2of2」の順に）
      const stamp = Date.now();
      for (const [i, p] of a.parts.entries()) {
        saveStep(`録音を送信中 ${i + 1}/${a.parts.length}…`, i / a.parts.length);
        const name = a.parts.length > 1 ? `voice-${stamp}-${i + 1}of${a.parts.length}.wav` : `voice-${stamp}.wav`;
        try { const { id } = await apiFile("upload", p.blob, name); attachments.push({ id, kind: "audio", name }); }
        catch (err) { if (isNetErr(err)) throw err; failed.push(`音声${i + 1}（${fmtSize(p.blob.size)}）`); }
      }
      continue;
    }
    try {
      saveStep("録音を送信中…");
      const name = `voice-${Date.now()}.${a.ext}`;
      const { id } = await apiFile("upload", a.blob, name);
      attachments.push({ id, kind: "audio", name });
    } catch (err) { if (isNetErr(err)) throw err; failed.push(`音声（${fmtSize(a.blob.size)}）`); }
  }
  saveStep("Notionに保存中…");
  const res = await api({ action: "save", databaseId: note.dbId, text: applyDict(text), props: note.props, attachments });
  note.text = text;
  return { url: res.url, failed };
}

// 後から文字起こしした文章を、ノートの文章に足す（1行目が空なら施設名と本文に分ける）
function mergeTranscript(text, t) {
  if (!t) return text;
  const fixed = applyDict(t);
  const [first = "", ...rest] = String(text).split("\n");
  let title = first.trim(), body = rest.join("\n");
  let add = fixed;
  if (!title) { const sp = splitTitle(fixed); title = sp.title; add = sp.body; }
  body = body.trim() ? body.replace(/\s+$/, "") + "\n" + add : add;
  return body.trim() ? title + "\n" + body : title;
}

// 電波・接続の問題か（それ以外のエラーと区別する）
function isNetErr(e) {
  if (!navigator.onLine) return true;
  const m = String(e?.message || e || "");
  return e?.name === "FunctionsFetchError" || e?.name === "AuthRetryableFetchError" || /offline|Failed to fetch|Load failed|NetworkError|network|Failed to send a request|ネットワーク/i.test(m);
}

// ===== 端末内の保存場所（IndexedDB。写真や音声もそのまま入れられる）=====
const outbox = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((resolve, reject) => {
    const r = indexedDB.open("notion-quick", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("outbox", { keyPath: "id" });
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction("outbox", mode);
      const req = fn(t.objectStore("outbox"));
      t.oncomplete = () => resolve(req?.result);
      t.onerror = () => reject(t.error);
    });
  };
  return {
    put: (n) => tx("readwrite", (s) => s.put(n)),
    del: (id) => tx("readwrite", (s) => s.delete(id)),
    all: async () => ((await tx("readonly", (s) => s.getAll())) || []).sort((a, b) => a.createdAt - b.createdAt),
  };
})();

// 送信済みの記録（文字だけ・最新200件。写真や音声は送ったら端末から消す）
function addSent(note, url) {
  const list = store.get("qn.sent") || [];
  list.unshift({ id: note.id, at: Date.now(), createdAt: note.createdAt, dbTitle: note.dbTitle, text: note.text, url,
                 photos: (note.images || []).length, audio: (note.audios || []).some((a) => a.keep) });
  store.set("qn.sent", list.slice(0, 200));
}

// 送信待ちを順番に送る（電波が戻ったとき・アプリを開いたときなど）
let flushing = false;
async function flushOutbox(manual = false) {
  if (flushing || !navigator.onLine) { if (manual && !navigator.onLine) toast("まだ電波がありません", true); return; }
  flushing = true;
  let sent = 0;
  try {
    // 自動で送り直すのは3回まで（失敗し続けるノートで料金がかさまないように）。それ以上は「保存されたノート」から手動で
    const list = (await outbox.all()).filter((n) => manual || (n.tries || 0) < 3);
    for (const [ni, note] of list.entries()) {
      try {
        note.fromOutbox = true;
        busyPrefix = list.length > 1 ? `端末のノート ${ni + 1}/${list.length} を送信中：` : "端末のノートを送信中：";
        if (!state.saving) busy("準備中…", ni / list.length);
        const res = await sendNote(note);
        await outbox.del(note.id);
        addSent(note, res.url);
        sent++;
      } catch (err) {
        if (isNetErr(err)) break;   // まだつながらない → また後で
        note.lastError = String(err?.message || err);
        note.tries = (note.tries || 0) + 1;
        await outbox.put(note);
      }
    }
  } finally {
    flushing = false; busyPrefix = "";
    if (!state.saving) busy(null);
    updateOutboxBadge();
    if (sent) { toast(`端末に保存していた${sent}件をNotionに送りました`); refreshNames(state.dbId); }
    if (!$("sheet").classList.contains("hidden") && $("sheetBody").dataset.view === "notes") renderNotes();
  }
}
window.addEventListener("online", () => setTimeout(flushOutbox, 1500));
setInterval(() => { if (navigator.onLine) flushOutbox(); }, 60 * 1000);

async function updateOutboxBadge() {
  try {
    const n = (await outbox.all()).length;
    const b = $("outboxBadge");
    b.textContent = n; b.classList.toggle("hidden", !n);
  } catch {}
}

    <button class="item" id="logoutBtn" style="color:var(--red)"><span class="ic" style="color:var(--red)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></span><span class="t">ログアウト</span></button>
    <div class="sep"></div>
    <h2>開いたとき</h2>
    <div class="item"><span class="t">すぐ入力欄にカーソルを入れる</span>
      <input type="checkbox" class="toggle" id="autoFocusToggle" ${isAutoFocus() ? "checked" : ""}></div>
    <div class="sep"></div>
    <h2>圏外で開く準備</h2>
    <p class="muted" id="offlineStatus">確認中…</p>
    <div class="sep"></div>
    <h2>録音のしかた</h2>
    <button class="item" data-mode="live"><span class="ic">${isLiveMode() ? "●" : "○"}</span>
      <span class="t">話しながら文字を表示<br><span class="s">約${fmtYen(PRICE_LIVE_PER_MIN * YEN_PER_USD)}/分・確認しながら話せる</span></span></button>
    <button class="item" data-mode="file"><span class="ic">${isLiveMode() ? "○" : "●"}</span>
      <span class="t">録音だけ・止めたら文字起こし<br><span class="s">約${fmtYen(PRICE_FILE_PER_MIN * YEN_PER_USD)}/分・安い（話している間は文字が出ない）</span></span></button>
    <div class="item"><span class="t" style="white-space:normal">録音もNotionに保存する<br><span class="s">ファイルのプロパティに入れます。4.7MBを超えたら声の部分だけを4.7MBずつに分けます</span></span>
      <input type="checkbox" class="toggle" id="keepAudioToggle" ${isKeepAudio() ? "checked" : ""}></div>
    <div class="item"><span class="t" style="white-space:normal">録音をAIでまとめる<br><span class="s">要約・話題・先生の反応・次回・Veeva用の文など（1件 約3〜5円）</span></span>
      <input type="checkbox" class="toggle" id="importSummaryToggle" ${isImportSummary() ? "checked" : ""}></div>
    <div class="sep"></div>
    <h2>今月の文字起こし料金（目安）</h2>
    ${(() => { const u = usageSummary(); return `<p class="muted" style="font-size:var(--fs);color:var(--ink)">約${fmtYen(u.total)}</p>
      <p class="muted">リアルタイム ${u.liveMin.toFixed(1)}分 ／ 録音ファイル ${u.fileMin.toFixed(1)}分${u.sumN ? ` ／ まとめ ${u.sumN}件（約${fmtYen(u.sumYen)}）` : ""}<br>この端末で使った分だけの目安です（1ドル=${YEN_PER_USD}円で計算・全アプリ共通のレート）。正確な金額はOpenAIの管理画面で確認できます。</p>`; })()}
    <p class="muted" style="text-align:center">Notion Quick ${APP_VERSION}</p>`);
  checkOfflineReady();
}

// 保存されたノート（端末内の記録なので圏外でも見られる）
$("historyBtn").onclick = () => renderNotes();
async function renderNotes() {
  const pending = await outbox.all().catch(() => []);
  const sent = store.get("qn.sent") || [];
  const dstr = (t) => { const d = new Date(t); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; };
  const tstr = (t) => { const d = new Date(t); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  const preview = (text) => esc(String(text || "").trim() || "（文字なし）");
  const card = (n, kind) => `<div class="note ${kind}">
      <div class="note-head"><b>${esc(n.dbTitle || "")}</b><span>${tstr(n.createdAt || n.at)}</span>
        ${kind === "pending" ? `<span class="tag-pending">未送信</span>` : ""}</div>
      <div class="note-body">${String(n.text || "").trim() ? preview(n.text)
        : (kind === "pending" && (n.audios || []).some((a) => a.needsText) ? "（録音のみ。送るときに文字起こしします）" : "（文字なし）")}</div>
      <div class="note-meta">${[
        (kind === "pending" ? (n.images || []).length : n.photos) ? `写真${kind === "pending" ? n.images.length : n.photos}枚` : "",
        (kind === "pending" ? (n.audios || []).length : n.audio) ? "音声あり" : "",
        kind === "pending" && (n.audios || []).some((a) => a.needsText) ? "文字起こしは送信時" : "",
        n.lastError ? `<span style="color:var(--red)">前回のエラー: ${esc(n.lastError.slice(0, 80))}</span>` : "",
      ].filter(Boolean).join(" ・ ")}</div>
      <div class="note-actions">${kind === "pending"
        ? `<button data-note-del="${n.id}">削除</button>`
        : (n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">Notionで開く</a>` : "")}</div>
    </div>`;
  // 日付ごとにまとめる
  const group = (list, kind) => {
    let out = "", last = "";
    for (const n of list) {
      const d = dstr(n.createdAt || n.at);
      if (d !== last) { out += `<div class="note-date">${d}</div>`; last = d; }
      out += card(n, kind);
    }
    return out;
  };
  openSheet(`<h2>保存されたノート<button class="close">閉じる</button></h2>
    ${pending.length ? `<div class="note-section">未送信 ${pending.length}件<button class="primary small" id="flushNow">今すぐ送る</button></div>
      <p class="muted">電波が戻ると自動で送ります。送るまでは、この端末の中に保存されています。</p>
      ${group(pending.slice().reverse(), "pending")}` : ""}
    <div class="note-section">送信済み</div>
    ${sent.length ? group(sent, "sent") : `<p class="muted">まだありません</p>`}`);
  $("sheetBody").dataset.view = "notes";
}
$("sheetBody").addEventListener("click", async (e) => {
  if (e.target.closest("#flushNow")) { e.target.closest("#flushNow").textContent = "送信中…"; await flushOutbox(true); renderNotes(); return; }
  const del = e.target.closest("[data-note-del]");
  if (del) {
    if (del.dataset.confirm !== "1") { del.dataset.confirm = "1"; del.textContent = "本当に削除"; del.style.color = "var(--red)"; return; }
    await outbox.del(del.dataset.noteDel); updateOutboxBadge(); renderNotes();
  }
});

// ===== テキスト =====
function onType() {
  autoGrow(); updateSaveBtn();
  clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 400);
}
// 1行目に改行が入ったら（音声入力・貼り付け・予測変換など、改行キー以外で入った場合も）、改行より後ろは本文の先頭へ移す
$("title").addEventListener("input", () => {
  const t = $("title");
  if (t.value.includes("\n")) {
    const [first, ...rest] = t.value.replace(/\r/g, "").split("\n");
    const tail = rest.join("\n").replace(/^\n+/, "");
    t.value = first;
    const b = $("body");
    if (tail) b.value = b.value ? tail + "\n" + b.value : tail;
    b.focus();
    const pos = tail.length;
    b.setSelectionRange(pos, pos);
  }
  onType();
});
$("body").addEventListener("input", onType);
// まだ何も書いていないときは、2行目（本文）をタップしてもカーソルは1行目に入れる
$("body").addEventListener("pointerdown", (e) => {
  if (!$("title").value.trim() && !$("body").value.trim()) { e.preventDefault(); $("title").focus(); }
});
$("body").addEventListener("focus", () => {
  if (!$("title").value.trim() && !$("body").value.trim()) $("title").focus();
});
// 1行目で改行 → 2行目（本文）へ
$("title").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    const t = $("title"), b = $("body");
    // カーソルより後ろの文字は本文の先頭へ
    const tail = t.value.slice(t.selectionEnd);
    t.value = t.value.slice(0, t.selectionStart);
    if (tail) b.value = b.value ? tail + "\n" + b.value : tail;
    b.focus(); b.setSelectionRange(0, 0);
    onType();
  }
});
// 本文の先頭で削除 → 1行目の末尾へ戻る（本文の1行目は1行目にくっつく）
$("body").addEventListener("keydown", (e) => {
  const b = $("body");
  if (e.key === "Backspace" && !e.isComposing && b.selectionStart === 0 && b.selectionEnd === 0) {
    e.preventDefault();
    const t = $("title"), pos = t.value.length;
    const [first, ...rest] = b.value.split("\n");
    t.value += first; b.value = rest.join("\n");
    t.focus(); t.setSelectionRange(pos, pos);
    onType();
  }
});
// 1行目に複数行を貼り付けたら、2行目以降は本文へ
$("title").addEventListener("paste", (e) => {
  const s = e.clipboardData?.getData("text") || "";
  if (!s.includes("\n")) return;
  e.preventDefault();
  const t = $("title");
  const before = t.value.slice(0, t.selectionStart), after = t.value.slice(t.selectionEnd);
  const [first, ...rest] = s.replace(/\r\n/g, "\n").split("\n");
  t.value = before + first;
  $("body").value = rest.join("\n") + after + ($("body").value ? "\n" + $("body").value : "");
  onType();
});

// ===== キーボード表示中はバー下の余白（ホームバー分）を消す =====
// 書く欄・URL欄にカーソルがある間＝キーボード表示中
const isTyping = (el) => el && el.matches("#title, #body, input[type=url]");
function placeBar() {
  const typing = isTyping(document.activeElement);
  // iPhoneはキーボードが出てもページの高さが変わらないので、
  // 「見えている範囲の下端」を計算して、バーだけをキーボードの真上に置く
  const vv = window.visualViewport;
  const lift = typing && vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  // 本当にキーボードが出ているときだけ切り替える
  // （起動時にカーソルだけ入ってキーボードが出ていないときに、バーが下にずれてホームバーと重なるのを防ぐ）
  const kbOpen = typing && lift > 80;
  document.body.classList.toggle("kb", kbOpen);
  $("bar").style.bottom = kbOpen ? lift + "px" : "";
}
document.addEventListener("focusin", () => { placeBar(); setTimeout(placeBar, 300); });
document.addEventListener("focusout", () => setTimeout(placeBar, 0));
if (window.visualViewport) {
  visualViewport.addEventListener("resize", placeBar);
  visualViewport.addEventListener("scroll", placeBar);
}

// ===== 新しい版が出ていたら自動で読み込み直す =====
(async () => {
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const m = (await res.text()).match(/APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION && !sessionStorage.getItem("qn.reloaded." + m[1])) {
      sessionStorage.setItem("qn.reloaded." + m[1], "1");
      location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
    }
  } catch {}
})();

// ===== 開いたらすぐ書けるように、入力欄にカーソルを入れる（設定でオン／オフ）=====
const isAutoFocus = () => store.get("qn.autoFocus") !== false;
function focusInput(force = false) {
  if (!force && !isAutoFocus()) return;
  if ($("app").classList.contains("hidden") || !$("sheet").classList.contains("hidden") || !$("recPanel").classList.contains("hidden")) return;
  if (document.activeElement && document.activeElement.matches("input, textarea")) return;
  // 1行目が空なら1行目へ、書きかけがあれば本文の最後へ
  const el = $("title").value.trim() ? $("body") : $("title");
  el.focus({ preventScroll: true });
  const n = el.value.length;
  try { el.setSelectionRange(n, n); } catch {}
}
// 書く欄の下の空いている所をタップしても、本文に入れるように
$("scroller").addEventListener("click", (e) => {
  if (e.target.closest("button, input, textarea, label, a, #props, #attachments, header")) return;
  focusInput(true);
});

// ===== 画面切り替え =====
function showLogin() { $("login").classList.remove("hidden"); $("app").classList.add("hidden"); }
async function showApp() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  // キャッシュがあれば先に開いて、裏で一覧を更新
  if (state.defaultId) openDb(state.defaultId);
  setTimeout(prefetchLiveKey, 2500);
  updateOutboxBadge();
  setTimeout(flushOutbox, 2000);
  setTimeout(focusInput, 300);
  try {
    await refreshDatabases();
    if (!state.dbId) openDb(state.defaultId);
    if (!state.defaultId) $("dbName").textContent = "データベースなし";
  } catch (e) { if (!isNetErr(e)) toast("一覧を取得できません: " + e.message, true); }
}

// 全アプリ共通の為替レートを読む（ログイン後）
async function loadRate() {
  try {
    const { data, error } = await sb.from("app_settings").select("value, updated_at").eq("app", "global").eq("key", "usd_jpy").maybeSingle();
    const v = Number(data?.value);
    if (error || !(v > 0)) return;
    YEN_PER_USD = v;
    localStorage.setItem("shared-usd-jpy", JSON.stringify({ v, at: data.updated_at }));
  } catch {}
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginBtn").disabled = true; $("loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("loginBtn").disabled = false;
  if (error) { $("loginErr").textContent = "ログインできませんでした（" + error.message + "）"; return; }
  showApp(); loadRate();
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    saveDraft();
    // 別のアプリに切り替えたり画面を消したりしたら、録音は止める（つけっぱなしで料金がかかるのを防ぐ）
    if (rec && rec.mr.state !== "inactive") { rec.autoStopped = "アプリを離れたので、録音を止めました"; stopRec(false); }
  } else { prefetchLiveKey(); flushOutbox(); setTimeout(focusInput, 200); }
});

// URLが /quick-note（最後の / なし）だと、圏外用の見張り役（Service Worker）の範囲外になるので付け直す
if (/\/quick-note$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search);

// 圏外でもアプリを開けるように、画面とライブラリを端末にとっておく
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

(async () => {
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch {}
  // 圏外ではログインの更新ができず session が空になることがある。
  // 前にログインした記録が端末にあれば、そのままアプリを開く（送信は電波が戻ってから）
  let loggedBefore = false;
  try { loggedBefore = Object.keys(localStorage).some((k) => /^sb-.*-auth-token$/.test(k)); } catch {}
  if (session) { showApp(); loadRate(); }
  else if (loggedBefore) showApp();
  else showLogin();
})();
</script>
