<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notion Quick">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Notion Quick</title>
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #191919;
    --ink2: #37352F;
    --sub: #787774;
    --faint: #A5A29C;
    --line: #EDECE9;
    --hover: #F1F1EF;
    --field: #F7F7F5;
    --red: #E03E3E;
    --fs-input: 20px;   /* 書く欄（1行目） */
    --fs: 17px;         /* 画面の文字すべて */
    --fs-sub: 14px;     /* 補足・ラベル */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink2); }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: var(--fs); line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  svg { display: block; flex: none; }

  /* ── ログイン ── */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 340px; }
  .login-box h1 { font-size: 24px; font-weight: 600; color: var(--ink); margin: 0 0 4px; letter-spacing: -.01em; }
  .login-box p { margin: 0 0 24px; color: var(--sub); font-size: var(--fs-sub); }
  .login-box input { width: 100%; font-size: var(--fs); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); margin-bottom: 10px; outline: none; }
  .login-box input:focus { border-color: #C7C6C3; background: #fff; }
  .primary { width: 100%; background: var(--ink); color: #fff; border-radius: 8px; padding: 12px; font-weight: 600; font-size: var(--fs); }
  .primary:disabled { opacity: .4; }
  .err { color: var(--red); font-size: var(--fs-sub); margin-top: 10px; min-height: 1em; }

  /* ── ヘッダー ── */
  /* 画面全体を「見えている高さ」に合わせる（キーボードが出たら縮む）。
     中身だけスクロールし、下のバーは常に中身のすぐ下＝キーボードの上にくる */
  /* 普通のページスクロール。下のバーは sticky なので、中身が短いときは中身のすぐ下、長いときは画面の下に貼りつく */
  #app { min-height: 100dvh; display: flex; flex-direction: column; }
  #scroller { flex: 1; }
  header {
    position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
    padding: calc(var(--safe-t) + 8px) 12px 8px; display: flex; align-items: center; gap: 4px;
  }
  #dbBtn { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; min-width: 0; color: var(--ink); font-weight: 600; font-size: var(--fs); }
  #dbBtn:active, .icon-btn:active { background: var(--hover); }
  #dbIcon { font-size: var(--fs); line-height: 1; color: var(--sub); }
  #dbBtn .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dbBtn .chev { color: var(--faint); }
  .spacer { flex: 1; }
  .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--sub); border-radius: 6px; }

  /* ── 入力（見た目は1つの欄。1行目＝タイトル 20px、2行目から＝本文 17px） ── */
  main { padding: 6px 20px 16px; max-width: 720px; margin: 0 auto; }
  #title, #body { width: 100%; border: none; outline: none; background: transparent; color: var(--ink); display: block; }
  #title { font-size: var(--fs-input); line-height: 1.4; padding: 6px 0 2px; resize: none; overflow: hidden; }
  #body { font-size: 17px; line-height: 1.35; resize: none; padding: 0 0 6px; min-height: 18vh; color: var(--ink2); }
  #title::placeholder, #body::placeholder { color: #C9C7C2; }

  /* プロパティ（大きめのボタンで、歩きながらでも押しやすく） */
  #props { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; font-size: var(--fs-sub); }
  .prop-row { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: var(--fs-sub); }
  .prop-row svg { color: var(--sub); }
  .date-val { position: relative; padding: 6px 8px; margin-left: -8px; border-radius: 8px; color: var(--ink); }
  .date-val:active { background: var(--hover); }
  .date-val input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .date-val .k { color: var(--sub); margin-right: 8px; }
  .link-btn { margin-left: auto; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--faint); }
  .link-btn.on { color: var(--ink); }
  .url-input { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 10px; padding: 8px 10px; font-size: 16px; outline: none; margin: 2px 0 6px; }
  .prop-label { font-size: 12px; color: var(--sub); margin: 8px 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 10px; border-radius: 6px; font-size: var(--fs-sub); line-height: 1.3; border: 1.5px solid transparent; opacity: .45; display: flex; align-items: center; gap: 8px; }
  .chip.on { opacity: 1; border-color: var(--ink); }
  .chip .sq { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; }
  .chip.check { background: var(--field); color: var(--ink2); opacity: 1; border-color: var(--line); display: flex; align-items: center; gap: 6px; }
  .chip.check.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 添付 */
  #attachments { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  #attachments:empty { display: none; }
  .thumb { position: relative; width: 88px; height: 88px; border-radius: 6px; overflow: hidden; background: var(--field); border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 6px; background: rgba(25,25,25,.6); color: #fff; font-size: var(--fs-sub); line-height: 26px; text-align: center; }
  .audio-item { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; background: #fff; }
  .audio-item .play { width: 40px; height: 40px; border-radius: 50%; background: var(--hover); display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .audio-item .meta { flex: 1; font-size: var(--fs); min-width: 0; color: var(--ink); }
  .audio-item .meta small { display: block; color: var(--sub); font-size: var(--fs-sub); }
  .audio-item label { font-size: var(--fs-sub); color: var(--sub); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .audio-item .del { color: var(--faint); padding: 10px; }

  /* 下のバー */
  /* 入力中（キーボード表示中）は、バーを画面に固定してキーボードのすぐ上に出す */
  .kb #bar { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: 10px; }
  .kb main { padding-bottom: 92px; }
  #bar {
    position: sticky; bottom: 0; z-index: 6; flex: none; background: #fff;
    border-top: 1px solid var(--line); padding: 10px 16px calc(var(--safe-b) + 10px);
    display: flex; align-items: center; gap: 10px;
  }
  .tool { width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink2); background: #fff; }
  .tool:active { background: var(--hover); }
  #recBtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); position: absolute; top: 11px; right: 11px; }
  #recBtn { position: relative; }
  #saveBtn { flex: 1; height: 56px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 600; font-size: var(--fs); }
  #saveBtn:disabled { background: #E3E2E0; color: #A5A29C; }

  /* 録音中 */
  #recPanel { position: fixed; inset: 0; z-index: 20; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  #recLabel { display: flex; align-items: center; gap: 8px; color: var(--sub); font-size: var(--fs); }
  #recLabel i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1.2s infinite; }
  #recLive { width: calc(100% - 40px); max-width: 640px; max-height: 38vh; overflow-y: auto; font-size: 17px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; text-align: left; }
  #recLive:empty { display: none; }
  #recLive .interim { color: var(--faint); }
  #recLive .note { color: var(--faint); font-size: var(--fs-sub); }
  #recTime { font-size: 56px; font-weight: 300; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  #recStop { width: 96px; height: 96px; border-radius: 50%; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; }
  #recStop span { width: 32px; height: 32px; border-radius: 5px; background: var(--ink); }
  #recCancel { color: var(--sub); font-size: var(--fs); padding: 12px 20px; border-radius: 6px; }
  @keyframes blink { 50% { opacity: .25; } }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* シート（Notionのメニュー風） */
  .sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(15,15,15,.25); display: flex; align-items: flex-end; }
  .sheet { width: 100%; max-height: 80vh; overflow-y: auto; background: #fff; border-radius: 12px 12px 0 0; padding: 8px 8px calc(var(--safe-b) + 14px); box-shadow: 0 -4px 24px rgba(0,0,0,.08); }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 8px; }
  .sheet h2 { font-size: var(--fs-sub); font-weight: 600; color: var(--sub); margin: 6px 10px 4px; display: flex; align-items: center; }
  .sheet h2 .close { margin-left: auto; color: var(--sub); font-weight: 400; }
  .item { display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 8px; width: 100%; text-align: left; color: var(--ink2); text-decoration: none; font-size: var(--fs); }
  .item:active { background: var(--hover); }
  .item .ic { width: 22px; text-align: center; color: var(--sub); }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { color: var(--faint); font-size: var(--fs-sub); white-space: nowrap; }
  .item .check { color: var(--ink); }
  .star { color: #D3D1CB; font-size: 20px; width: 28px; }
  .star.on { color: var(--ink); }
  .toggle { width: 22px; height: 22px; accent-color: #191919; }
  .muted { color: var(--sub); font-size: var(--fs-sub); margin: 6px 10px 10px; line-height: 1.6; }
  .dict-add { display: grid; gap: 8px; margin: 4px 10px 8px; }
  .dict-add input { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); outline: none; }
  .del-dict { color: var(--faint); padding: 6px; }
  .sep { height: 1px; background: var(--line); margin: 6px 4px; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 92px); transform: translateX(-50%); z-index: 40; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 10px; font-size: var(--fs-sub); max-width: 90vw; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .toast.bad { background: var(--red); }
  .toast a { color: #fff; text-decoration: underline; margin-left: 10px; }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>Notion Quick</h1>
    <p>日記アプリと同じアカウントでログイン</p>
    <input id="email" type="email" placeholder="メールアドレス" autocomplete="username" required>
    <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" required>
    <button class="primary" type="submit" id="loginBtn">ログイン</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <div id="scroller">
  <header>
    <button id="dbBtn">
      <span id="dbIcon"></span>
      <span class="name" id="dbName">読み込み中…</span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="icon-btn" id="historyBtn" aria-label="最近の保存">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>

  <main>
    <textarea id="title" rows="1" placeholder="ここに書く" autocomplete="off" enterkeyhint="next"></textarea>
    <textarea id="body"></textarea>
    <div id="attachments"></div>
    <div id="props"></div>
  </main>
  </div>

  <div id="bar">
    <button class="tool" id="photoBtn" aria-label="写真">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>
    </button>
    <button class="tool" id="recBtn" aria-label="録音">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      <span class="dot"></span>
    </button>
    <button id="saveBtn" disabled>保存</button>
  </div>
  <input type="file" id="photoInput" accept="image/*" multiple class="hidden">
</section>

<div id="recPanel" class="hidden">
  <div id="recLabel"><i></i><span id="recStatus">録音中</span></div>
  <div id="recTime">0:00</div>
  <div id="recLive"></div>
  <button id="recStop" aria-label="停止"><span></span></button>
  <div class="spinner hidden" id="recSpin"></div>
  <button id="recCancel">キャンセル</button>
</div>

<div id="sheet" class="sheet-bg hidden"><div class="sheet" id="sheetBody"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 設定 =====
const SUPABASE_URL = "https://oqtyorwlrnrcyjxiassg.supabase.co";
const SUPABASE_KEY = "sb_publishable_5KRsDfHG07lsUL7uUr6zpQ_2ehucxbJ"; // 公開用キー（ブラウザに置いてOK）
const FN = "quick-note";
const APP_VERSION = "2026.11.16-5";     // 更新のたびに変える
const DEFAULT_DB_TITLE = "日報";          // 初回だけ、この名前のDBをデフォルトにする
const AUTO_CHECK_ON_AUDIO = "音声";        // 録音したら、この名前のチェックボックスを自動でON
const MAX_REC_SEC = 15 * 60;               // 録音は最長15分
// 話しながら表示（iPhone標準の音声認識）。iPhoneでは録音とマイクを取り合って録音が無音になるため、いったん止める
const LIVE_PREVIEW = false;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);

// ===== 小物 =====
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayStr = () => ymd(new Date());
function jpDate(s) { const [y, m, d] = s.split("-").map(Number); const w = "日月火水木金土"[new Date(y, m - 1, d).getDay()]; return `${y}年${m}月${d}日（${w}）`; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const NOTION_FILE_LIMIT = 5 * 1024 * 1024;   // Notion無料プランの1ファイル上限
const fmtSize = (b) => b >= 1024 * 1024 ? (b / 1024 / 1024).toFixed(1) + "MB" : Math.max(1, Math.round(b / 1024)) + "KB";
const mmss = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;

// Notion の色（ライトモードのタグ色）
const COLORS = {
  default: ["#E3E2E080", "#32302C"], gray: ["#E3E2E0", "#32302C"], brown: ["#EEE0DA", "#442A1E"],
  orange: ["#FADEC9", "#49290E"], yellow: ["#FDECC8", "#402C1B"], green: ["#DBEDDB", "#1C3829"],
  blue: ["#D3E5EF", "#183347"], purple: ["#E8DEEE", "#412454"], pink: ["#F5E0E9", "#4C2337"], red: ["#FFE2DD", "#5D1715"],
};
const colorStyle = (c) => { const [bg, fg] = COLORS[c] || COLORS.default; return `background:${bg};color:${fg}`; };

// プロパティの種類ごとのアイコン（Notion風の細線）
const ICONS = {
  date: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  multi_select: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>',
  select: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 11l3.5 3.5 3.5-3.5"/></svg>',
  status: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 2.4"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/></svg>',
  checkbox: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>',
  url: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>',
};
const PAGE_ICON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6" stroke-linecap="round"/></svg>';
const dbIconHtml = (d) => d?.icon ? esc(d.icon) : PAGE_ICON;

let toastTimer;
function toast(msg, bad = false, link) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.innerHTML = esc(msg) + (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">開く</a>` : "");
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), bad ? 5000 : 3000);
}

async function api(body) {
  const { data, error } = await sb.functions.invoke(FN, { body });
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); if (j?.error) msg = j.error; } catch {}
    if (error.context?.status === 401) { await sb.auth.signOut(); showLogin(); }
    throw new Error(msg);
  }
  return data;
}
function apiFile(action, file, name, extra = {}) {
  const fd = new FormData();
  fd.append("action", action);
  fd.append("file", file, name || file.name || "file");
  for (const [k, v] of Object.entries(extra)) if (v) fd.append(k, v);
  return api(fd);
}

// タイトル欄と本文欄を「1行目＋2行目以降」の1つの文字列として扱う
// タイトルが空でも本文は本文のまま扱う（本文の1行目がタイトルに化けないように）
function getText() {
  const t = $("title").value.trim(), b = $("body").value;
  return b.trim() ? t + "\n" + b : t;
}

// ===== 読み替え辞書（例: 矢原クリニック → やはらクリニック）=====
const getDict = () => (store.get("qn.dict") || []).filter((d) => d && d.from && d.to);
function applyDict(s) {
  let out = String(s ?? "");
  // 長い語から置き換える（短い語が先に当たって崩れないように）
  for (const d of getDict().sort((a, b) => b.from.length - a.from.length)) out = out.split(d.from).join(d.to);
  return out;
}

// ===== 施設名の候補（日報DBの過去のタイトル）=====
function knownNames() {
  const raw = store.get("qn.titles." + state.dbId) || [];
  const names = [...new Set([...raw.map((x) => applyDict(x.name)), ...getDict().map((d) => d.to)])];
  return names.filter((n) => n && n.length <= 40);
}
async function refreshNames(id) {
  try {
    const { titles } = await api({ action: "titles", databaseId: id });
    store.set("qn.titles." + id, titles);
  } catch {}
}
// 文字起こしのヒント（よく行く施設名ほど先に）
const transcribeHint = () => {
  const names = knownNames().slice(0, 60);
  return names.length ? "施設名: " + names.join("、") + "。" : "";
};

// 話した内容を「施設名」と「本文」に分ける
//  1) 冒頭が過去の施設名と一致したら、そこで区切る（長い名前を優先）
//  2) 一致しなければ、最初の「。」までをタイトルにする（30文字以内のとき）
//  3) どちらでもなければ、全部を本文にする
function splitTitle(text) {
  const t = String(text || "").trim();
  const squash = (s) => s.replace(/[\s　]/g, "");
  const flat = squash(t);
  const names = knownNames().sort((a, b) => b.length - a.length);
  for (const name of names) {
    const n = squash(name);
    if (!n || !flat.startsWith(n)) continue;
    // 空白を飛ばしながら、元の文章のどこまでが施設名かを数える
    let i = 0, k = 0;
    while (i < t.length && k < n.length) { if (!/[\s　]/.test(t[i])) k++; i++; }
    return { title: name, body: t.slice(i).replace(/^[\s　。、,.．，:：]+/, "") };
  }
  const m = t.match(/^(.{1,30}?)[\s　]*[。．.](.*)$/s);
  if (m) return { title: m[1].trim(), body: m[2].replace(/^[\s　]+/, "") };
  return { title: "", body: t };
}
function setText(s) {
  const lines = String(s || "").split("\n");
  $("title").value = lines[0] || "";
  $("body").value = lines.slice(1).join("\n");
  autoGrow();
}

// 長辺2048px・JPEGに縮小（Notion無料プランの5MB制限に収めるため）
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 2048;
      const r = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src);
      c.toBlob((b) => b ? resolve(new File([b], `photo-${Date.now()}.jpg`, { type: "image/jpeg" })) : reject(), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(); };
    img.src = src;
  });
}

// ===== 録音 → 文字起こし =====
let rec = null;
function pickMime() {
  const list = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
  return list.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
const extOf = (mime) => mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : mime.includes("webm") ? "webm" : "m4a";

$("recBtn").onclick = startRec;
async function startRec() {
  if (!window.MediaRecorder) { toast("このブラウザは録音に対応していません", true); return; }
  startLive();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { stopLive(); toast("マイクの使用が許可されていません（設定 → Safari → マイク）", true); return; }
  const mime = pickMime();
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 48000 } : undefined);
  const chunks = [];
  rec = { mr, stream, chunks, start: Date.now(), cancelled: false, timer: null };
  mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = onRecStop;
  mr.start(1000);
  $("recTime").textContent = "0:00";
  $("recStatus").textContent = "録音中";
  $("recLabel").querySelector("i").classList.remove("hidden");
  $("recStop").classList.remove("hidden"); $("recSpin").classList.add("hidden"); $("recCancel").classList.remove("hidden");
  $("recPanel").classList.remove("hidden");
  rec.timer = setInterval(() => {
    const sec = (Date.now() - rec.start) / 1000;
    $("recTime").textContent = mmss(sec);
    if (sec >= MAX_REC_SEC) stopRec();
  }, 250);
}
function stopRec(cancel = false) {
  if (!rec || rec.mr.state === "inactive") return;
  rec.cancelled = cancel;
  stopLive();
  clearInterval(rec.timer);
  rec.mr.stop();
  rec.stream.getTracks().forEach((t) => t.stop());
}
// ===== 話しながら文字を表示（iPhone標準の音声認識・無料）=====
// 止めたあとはAIの文字起こしで正確な文章に差し替える。AIが失敗したらこの文字を使う。
const live = { rec: null, finalText: "", interim: "", on: false, failed: false, reason: "", retried: false };
function renderLive() {
  const el = $("recLive");
  el.innerHTML = live.failed && !live.finalText
    ? `<span class="note">話しながらの表示は使えませんでした（止めると文字起こしされます）<br>理由: ${esc(live.reason || "不明")}</span>`
    : esc(live.finalText) + (live.interim ? `<span class="interim">${esc(live.interim)}</span>` : "");
  el.scrollTop = el.scrollHeight;
}
function startLive() {
  if (!LIVE_PREVIEW) { $("recLive").innerHTML = ""; return; }
  live.finalText = ""; live.interim = ""; live.failed = false; live.on = true; live.reason = ""; live.retried = false;
  $("recLive").innerHTML = "";
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { live.failed = true; live.reason = "この画面では音声認識の機能がありません"; renderLive(); return; }
  const run = () => {
    if (!live.on) return;
    const r = new SR();
    r.lang = "ja-JP"; r.continuous = true; r.interimResults = true;
    r.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) live.finalText += t; else interim += t;
      }
      live.interim = interim;
      renderLive();
    };
    r.onerror = (e) => {
      if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) {
        // マイクの取り合いの可能性があるので、1回だけ少し待って再挑戦
        if (!live.retried && e.error === "audio-capture") { live.retried = true; return; }
        live.failed = true; live.on = false; live.reason = e.error; renderLive();
      }
    };
    // 無音などで止まったら、録音中は自動で再開
    r.onend = () => {
      if (live.interim) { live.finalText += live.interim; live.interim = ""; renderLive(); }
      if (live.on) setTimeout(run, 150);
    };
    try { r.start(); live.rec = r; } catch (err) { live.failed = true; live.reason = String(err?.message || err); renderLive(); }
  };
  run();
}
function stopLive() {
  live.on = false;
  try { live.rec?.stop(); } catch {}
  if (live.interim) { live.finalText += live.interim; live.interim = ""; }
  renderLive();
}

$("recStop").onclick = () => stopRec(false);
$("recCancel").onclick = () => stopRec(true);

async function onRecStop() {
  const r = rec;
  const sec = (Date.now() - r.start) / 1000;
  if (r.cancelled) { $("recPanel").classList.add("hidden"); rec = null; return; }
  const liveText = live.finalText.trim();
  // マイクを同時に使えず録音が空だった場合は、表示していた文字をそのまま使う
  if (!r.chunks.length || r.chunks.reduce((n, c) => n + c.size, 0) < 2000) {
    if (liveText) placeTranscript(liveText);
    else toast("録音できませんでした。もう一度お試しください", true);
    $("recPanel").classList.add("hidden"); rec = null; return;
  }
  const mime = (r.mr.mimeType || r.chunks[0].type || "audio/mp4");
  const ext = extOf(mime);
  const blob = new Blob(r.chunks, { type: mime.split(";")[0] });
  $("recStop").classList.add("hidden"); $("recCancel").classList.add("hidden"); $("recSpin").classList.remove("hidden");
  $("recLabel").querySelector("i").classList.add("hidden");
  $("recStatus").textContent = "AIで仕上げ中…";
  const audio = { blob, url: URL.createObjectURL(blob), ext, sec, keep: blob.size <= NOTION_FILE_LIMIT };
  try {
    const { text } = await apiFile("transcribe", blob, `voice-${Date.now()}.${ext}`, { prompt: transcribeHint() });
    if (!(text || liveText).trim()) {
      toast("声を聞き取れませんでした。マイクが使えているか確認して、もう一度録音してください", true);
      $("recPanel").classList.add("hidden"); rec = null;
      return;
    }
    placeTranscript(text || liveText);
    state.audios.push(audio);
    autoCheckAudio();
    renderAttachments(); renderProps(); updateSaveBtn();
  } catch (e) {
    // 文字起こしに失敗しても録音は残す。話しながら表示した文字があればそれを使う
    audio.text = false;
    state.audios.push(audio);
    if (liveText) { placeTranscript(liveText); autoCheckAudio(); renderProps(); }
    renderAttachments(); updateSaveBtn();
    toast(liveText ? "AIの文字起こしに失敗したので、話しながら表示した文字を入れました" : "文字起こしに失敗しました: " + e.message, true);
  } finally {
    $("recPanel").classList.add("hidden");
    rec = null;
  }
}

// 文字起こし結果を入れる（辞書で読み替え→1行目が空なら施設名と本文に分ける）
function placeTranscript(text) {
  const fixed = applyDict(text);
  if (!$("title").value.trim()) {
    const { title, body } = splitTitle(fixed);
    $("title").value = title;
    insertText(body);
  } else {
    insertText(fixed);
  }
}

// 本文の最後に追記する
function insertText(t) {
  const b = $("body");
  if (t) b.value = b.value.trim() ? b.value.replace(/\s+$/, "") + "\n" + t : t;
  autoGrow(); updateSaveBtn(); saveDraft();
}

// ===== 保存 =====
$("saveBtn").onclick = save;
async function save() {
  if (state.saving) return;
  state.saving = true; updateSaveBtn();
  try {
    // 写真・音声のアップロードに失敗しても、文字とプロパティは必ず保存する
    const attachments = [];
    const failed = [];
    for (const im of state.images) {
      try {
        const { id } = await apiFile("upload", im.file);
        attachments.push({ id, kind: "image" });
      } catch { failed.push("写真"); }
    }
    for (const a of state.audios.filter((x) => x.keep)) {
      try {
        const { id } = await apiFile("upload", a.blob, `voice-${Date.now()}.${a.ext}`);
        // webm は Notion の音声ブロックが対応していないのでファイルとして添付
        attachments.push({ id, kind: a.ext === "webm" ? "file" : "audio" });
      } catch { failed.push(`音声（${fmtSize(a.blob.size)}）`); }
    }
    const res = await api({
      action: "save",
      databaseId: state.dbId,
      text: applyDict(getText()),   // 1行目がタイトル、2行目からが本文（辞書で読み替え）
      props: state.values,
      attachments,
    });
    if (failed.length) toast(`文字は保存しました。${failed.join("・")}は添付できませんでした`, true, res.url);
    else toast("保存しました", false, res.url);
    refreshNames(state.dbId);
    resetForm();
  } catch (e) {
    toast("保存できませんでした: " + e.message, true);
  } finally {
    state.saving = false; updateSaveBtn();
  }
}

function resetForm() {
  store.del("qn.draft." + state.dbId);
  state.images.forEach((im) => URL.revokeObjectURL(im.url));
  state.audios.forEach((a) => URL.revokeObjectURL(a.url));
  state.images = []; state.audios = []; state.showUrl = false;
  const keepDates = {};
  for (const p of state.schema.properties) if (p.type === "date") keepDates[p.name] = state.values[p.name];
  applySchema(state.schema);
  Object.assign(state.values, keepDates);
  renderProps(); renderAttachments(); autoGrow();
  $("title").focus();   // 続けて次を書けるように
}

// ===== シート =====
function openSheet(html) { $("sheetBody").innerHTML = `<div class="grab"></div>` + html; $("sheet").classList.remove("hidden"); }
function closeSheet() { $("sheet").classList.add("hidden"); }
$("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet" || e.target.closest(".close")) closeSheet(); });

// DB 切り替え
$("dbBtn").onclick = () => {
  const list = visibleDbs();
  openSheet(`<h2>保存先</h2>
    ${list.length ? list.map((d) => `<button class="item" data-pick="${d.id}">
      <span class="ic">${dbIconHtml(d)}</span><span class="t">${esc(d.title)}</span>
      ${d.id === state.defaultId ? `<span class="s">デフォルト</span>` : ""}
      ${d.id === state.dbId ? `<svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>` : ""}</button>`).join("")
      : `<p class="muted">表示できるデータベースがありません。設定から追加してください。</p>`}`);
};
$("sheetBody").addEventListener("click", (e) => {
  const pick = e.target.closest("[data-pick]");
  if (pick) { closeSheet(); openDb(pick.dataset.pick); return; }
  const dd = e.target.closest("[data-dict-del]");
  if (dd) { const list = getDict(); list.splice(+dd.dataset.dictDel, 1); store.set("qn.dict", list); renderSettings(); return; }
  if (e.target.closest("#dictAdd")) {
    const from = $("dictFrom").value.trim(), to = $("dictTo").value.trim();
    if (!from || !to || from === to) { toast("まちがいと正しい言葉の両方を入れてください", true); return; }
    store.set("qn.dict", [...getDict().filter((d) => d.from !== from), { from, to }]);
    renderSettings();
    return;
  }
  const star = e.target.closest("[data-star]");
  if (star) { state.defaultId = star.dataset.star; store.set("qn.default", state.defaultId); state.hidden = state.hidden.filter((x) => x !== state.defaultId); store.set("qn.hidden", state.hidden); renderSettings(); return; }
  const rl = e.target.closest("#reloadDbs");
  if (rl) {
    rl.querySelector(".t").textContent = "読み込み中…";
    refreshDatabases().then(renderSettings).catch((err) => toast(err.message, true));
    return;
  }
  if (e.target.closest("#logoutBtn")) { sb.auth.signOut(); closeSheet(); showLogin(); }
});
$("sheetBody").addEventListener("change", (e) => {
  const id = e.target.dataset.show;
  if (id === undefined) return;
  state.hidden = e.target.checked ? state.hidden.filter((x) => x !== id) : [...new Set([...state.hidden, id])];
  store.set("qn.hidden", state.hidden);
});

// 設定
$("settingsBtn").onclick = renderSettings;
function renderSettings() {
  openSheet(`<h2>データベース<button class="close">完了</button></h2>
    <p class="muted">★ 起動時に開く　／　チェック 切り替えに表示</p>
    ${state.databases.map((d) => `<div class="item">
      <button class="star ${d.id === state.defaultId ? "on" : ""}" data-star="${d.id}">${d.id === state.defaultId ? "★" : "☆"}</button>
      <span class="ic">${dbIconHtml(d)}</span><span class="t">${esc(d.title)}</span>
      <input type="checkbox" class="toggle" data-show="${d.id}" ${state.hidden.includes(d.id) ? "" : "checked"}>
    </div>`).join("")}
    <p class="muted">一覧にないデータベースは、Notionでそのデータベースを開き「…」→「接続」からインテグレーションを追加すると表示されます。</p>
    <div class="sep"></div>
    <h2>読み替え辞書</h2>
    <p class="muted">文字起こしや入力でこの言葉が出たら、保存前に置き換えます。施設名の候補にも反映されます。</p>
    ${getDict().map((d, i) => `<div class="item"><span class="t">${esc(d.from)}　→　<b style="font-weight:600;color:var(--ink)">${esc(d.to)}</b></span>
      <button class="del-dict" data-dict-del="${i}" aria-label="削除"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("")}
    <div class="dict-add">
      <input id="dictFrom" placeholder="まちがい（例: 矢原クリニック）" autocomplete="off">
      <input id="dictTo" placeholder="正しい（例: やはらクリニック）" autocomplete="off">
      <button class="primary" id="dictAdd">追加</button>
    </div>
    <p class="muted">施設名の候補：${knownNames().length}件（${esc(state.databases.find((d) => d.id === state.dbId)?.title || "")}の過去のタイトルから）</p>
    <div class="sep"></div>
    <button class="item" id="reloadDbs"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></span><span class="t">一覧を更新</span></button>
    <button class="item" id="logoutBtn" style="color:var(--red)"><span class="ic" style="color:var(--red)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></span><span class="t">ログアウト</span></button>
    <p class="muted" style="text-align:center">Notion Quick ${APP_VERSION}</p>`);
}

// 最近の保存
$("historyBtn").onclick = async () => {
  openSheet(`<h2>最近の保存</h2><div class="spinner" style="margin:24px auto"></div>`);
  try {
    const { pages } = await api({ action: "recent", databaseId: state.dbId });
    const fmt = (s) => { const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
    openSheet(`<h2>最近の保存<button class="close">閉じる</button></h2>
      ${pages.length ? pages.map((p) => `<a class="item" href="${esc(p.url)}" target="_blank" rel="noopener"><span class="ic">${PAGE_ICON}</span><span class="t">${esc(p.title)}</span><span class="s">${fmt(p.created)}</span></a>`).join("") : `<p class="muted">まだありません</p>`}`);
  } catch (e) { closeSheet(); toast(e.message, true); }
};

// ===== テキスト =====
function onType() {
  autoGrow(); updateSaveBtn();
  clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 400);
}
$("title").addEventListener("input", onType);
$("body").addEventListener("input", onType);
// 1行目で改行 → 2行目（本文）へ
$("title").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    const t = $("title"), b = $("body");
    // カーソルより後ろの文字は本文の先頭へ
    const tail = t.value.slice(t.selectionEnd);
    t.value = t.value.slice(0, t.selectionStart);
    if (tail) b.value = b.value ? tail + "\n" + b.value : tail;
    b.focus(); b.setSelectionRange(0, 0);
    onType();
  }
});
// 本文の先頭で削除 → 1行目の末尾へ戻る（本文の1行目は1行目にくっつく）
$("body").addEventListener("keydown", (e) => {
  const b = $("body");
  if (e.key === "Backspace" && !e.isComposing && b.selectionStart === 0 && b.selectionEnd === 0) {
    e.preventDefault();
    const t = $("title"), pos = t.value.length;
    const [first, ...rest] = b.value.split("\n");
    t.value += first; b.value = rest.join("\n");
    t.focus(); t.setSelectionRange(pos, pos);
    onType();
  }
});
// 1行目に複数行を貼り付けたら、2行目以降は本文へ
$("title").addEventListener("paste", (e) => {
  const s = e.clipboardData?.getData("text") || "";
  if (!s.includes("\n")) return;
  e.preventDefault();
  const t = $("title");
  const before = t.value.slice(0, t.selectionStart), after = t.value.slice(t.selectionEnd);
  const [first, ...rest] = s.replace(/\r\n/g, "\n").split("\n");
  t.value = before + first;
  $("body").value = rest.join("\n") + after + ($("body").value ? "\n" + $("body").value : "");
  onType();
});

// ===== キーボード表示中はバー下の余白（ホームバー分）を消す =====
// 書く欄・URL欄にカーソルがある間＝キーボード表示中
const isTyping = (el) => el && el.matches("#title, #body, input[type=url]");
function placeBar() {
  const typing = isTyping(document.activeElement);
  document.body.classList.toggle("kb", typing);
  // iPhoneはキーボードが出てもページの高さが変わらないので、
  // 「見えている範囲の下端」を計算して、バーだけをキーボードの真上に置く
  const vv = window.visualViewport;
  const lift = typing && vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  $("bar").style.bottom = lift + "px";
}
document.addEventListener("focusin", () => { placeBar(); setTimeout(placeBar, 300); });
document.addEventListener("focusout", () => setTimeout(placeBar, 0));
if (window.visualViewport) {
  visualViewport.addEventListener("resize", placeBar);
  visualViewport.addEventListener("scroll", placeBar);
}

// ===== 新しい版が出ていたら自動で読み込み直す =====
(async () => {
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const m = (await res.text()).match(/APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION && !sessionStorage.getItem("qn.reloaded." + m[1])) {
      sessionStorage.setItem("qn.reloaded." + m[1], "1");
      location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
    }
  } catch {}
})();

// ===== 画面切り替え =====
function showLogin() { $("login").classList.remove("hidden"); $("app").classList.add("hidden"); }
async function showApp() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  // キャッシュがあれば先に開いて、裏で一覧を更新
  if (state.defaultId) openDb(state.defaultId);
  try {
    await refreshDatabases();
    if (!state.dbId) openDb(state.defaultId);
    if (!state.defaultId) $("dbName").textContent = "データベースなし";
  } catch (e) { toast("一覧を取得できません: " + e.message, true); }
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginBtn").disabled = true; $("loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("loginBtn").disabled = false;
  if (error) { $("loginErr").textContent = "ログインできませんでした（" + error.message + "）"; return; }
  showApp();
});

document.addEventListener("visibilitychange", () => { if (document.hidden) saveDraft(); });

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) showApp(); else showLogin();
})();
</script>
</body>
